    <div id="root"></div><noscript><header class="subpage-nav"><a href="/">WhitePact</a></header><main class="editorial-page"><h1>Refund Policy</h1><p class="page-lead">How to cancel a WhitePact subscription or request review of duplicate purchases, billing errors and paid-service access problems.</p><section><span>1</span><div><h2>Scope</h2><p>This policy applies to paid WhitePact digital software and services. Free Community software has no purchase charge to refund. Your purchase terms and any applicable merchant-of-record terms also apply; nothing here limits rights required by applicable law.</p></div></section><section><span>2</span><div><h2>Subscription cancellation</h2><p>Use the billing portal available from your account to cancel recurring billing. If the portal is unavailable or you cannot access your account, email annaduraiguruprasath7@gmail.com for cancellation assistance. Cancellation stops future renewals once processed in accordance with your purchase terms. It does not automatically refund a completed billing period. Access for the remainder of a paid period follows the terms of your order.</p></div></section><section><span>3</span><div><h2>Refund review</h2><p>Contact us about duplicate charges, accidental duplicate purchases, proven billing errors or inability to access a paid service attributable to WhitePact. We review the transaction and service circumstances and arrange an appropriate correction or refund where warranted or required by law. Refund requests are reviewed in accordance with the circumstances of the purchase, the applicable subscription terms, and rights required by applicable law.</p></div></section><section><span>4</span><div><h2>How to request a refund</h2><p>Email annaduraiguruprasath7@gmail.com with the subject WhitePact refund request. Include the account email, order or invoice reference, purchase date and a description of the issue. Never send passwords, API keys or full card details. If a merchant of record handled your purchase, you may also use the support details on its receipt. We may request information needed to verify the transaction and will explain the outcome through your contact address.</p></div></section><section><span>5</span><div><h2>Processing and misuse</h2><p>Approved refunds are handled through the applicable billing provider, ordinarily to the original payment method; processing time depends on that provider and your financial institution. We may investigate fraudulent, abusive or materially misleading requests, without limiting valid statutory rights or remedies for genuine billing errors.</p></div></section><section><span>6</span><div><h2>Consumer rights and agreed services</h2><p>Mandatory cancellation, withdrawal and refund rights under applicable consumer law take priority over conflicting policy language. For separately agreed enterprise services, the written order describes the deliverables and any service-specific cancellation terms, subject to those rights. Contact us if you need help identifying the terms applicable to your purchase.</p></div></section><p><a href="mailto:annaduraiguruprasath7@gmail.com">Contact WhitePact</a></p></main><footer class="subpage-footer"><nav aria-label="Public footer"><a href="/pricing">Pricing</a> <a href="/terms">Terms</a> <a href="/privacy">Privacy</a> <a href="/refund-policy">Refund Policy</a> <a href="/contact">Contact</a></nav></footer></noscript>
