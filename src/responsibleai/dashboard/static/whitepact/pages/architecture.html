  <body>
    <div id="root"></div><noscript><header><a href="/">WhitePact</a><nav aria-label="Primary navigation"><a href="/product">Product</a> <a href="/architecture">Architecture</a> <a href="/developers">Developers</a> <a href="/security">Security</a> <a href="/enterprise">Enterprise</a> <a href="/docs">Docs</a> <a href="/about">Company</a> <a href="/trust">Trust</a> <a href="/pricing">Pricing</a> <a href="/terms">Terms</a> <a href="/privacy">Privacy</a> <a href="/refund-policy">Refund Policy</a> <a href="/contact">Contact</a></nav></header><main id="static-main" class="editorial-page"><h1>Separate thought from authority</h1><p class="page-lead">Agent intent is not execution authority. Explore WhitePact&#39;s control, execution, evidence and revocation layers on supported, configured enforcement paths.</p><section><div><h2>The operating doctrine</h2><p>The agent may think freely. It may plan freely. But it cannot act outside independently enforced authority.</p></div></section><section><div><h2>Identity is not authority</h2><p>A session or machine credential establishes who is asking. The configured service evaluates the action&#39;s authority, intent, consent, policy, risk and approval against current authorization state. A subscription or client-side assertion cannot substitute for those checks.</p></div></section><section><div><h2>Evaluation is not enforcement</h2><p>A judgment becomes operational only when the consequential effect passes through the supported guarded execution boundary. Integrators must constrain alternative paths, protect credentials and establish what code and infrastructure remain trusted.</p></div></section><section><div><h2>Know the trusted boundary</h2><p>Arbitrary tool or plugin code inside a trusted process and direct calls outside configured paths are not universally controlled. Isolation depends on the supported deployment configuration. A Python configuration flag does not establish an independent boundary for arbitrary code.</p></div></section><section><div><h2>Trust the deployment, not just the diagram</h2><p>The operator must trust the configured service code, credential handling, storage and execution adapters. Route agent calls through the supported boundary and restrict alternative access to consequential systems. An operator who intentionally supplies a direct path around WhitePact has created a bypass outside that enforcement scope.</p></div></section><section><div><h2>A failed check is not permission</h2><p>Authentication failure, unavailable authorization state or a denied admission must not be treated by the integrator as permission to fall back to direct execution. Dependency failure and uncertainty are operational incidents to handle explicitly. Validate each selected adapter&#39;s failure behavior; this conceptual map does not certify every deployment as fail-closed.</p></div></section><section><div><h2>Failure and uncertainty</h2><p>Approval-required and denied requests must not be treated as permission to execute. UNKNOWN does not prove success or failure. Missing evidence, an HTTP success or a redirect is insufficient confirmation of a downstream effect; reconcile before retrying.</p></div></section><section><div><h2>Revocation has a time boundary</h2><p>Revocation blocks subsequent checks on the supported path. It cannot retroactively reverse an external effect that has already completed. Grant scope, expiry and current authorization checks must be reviewed in the selected integration contract.</p></div></section><p><a href="/contact">Discuss an evaluation</a></p><section><h2>Conceptual control chain</h2><p>This map does not assert every adapter invokes every subsystem. Isolation depends on configured deployment.</p><ol><li>Constitution</li><li>Identity</li><li>Authority</li><li>Intent</li><li>Policy</li><li>Capability Graph</li><li>Risk</li><li>Approval</li><li>Judgment</li><li>Short-Lived Execution Grant</li><li>Isolated Execution</li><li>Evidence</li><li>Audit</li><li>Revocation</li></ol></section></main><footer><nav aria-label="Public footer"><a href="/product">Product</a> <a href="/architecture">Architecture</a> <a href="/developers">Developers</a> <a href="/security">Security</a> <a href="/enterprise">Enterprise</a> <a href="/docs">Docs</a> <a href="/about">Company</a> <a href="/trust">Trust</a> <a href="/pricing">Pricing</a> <a href="/terms">Terms</a> <a href="/privacy">Privacy</a> <a href="/refund-policy">Refund Policy</a> <a href="/contact">Contact</a></nav></footer></noscript>
