    <div id="root"></div><noscript><header class="subpage-nav"><a href="/">WhitePact</a></header><main class="editorial-page"><h1>Pricing</h1><p class="page-lead">Open-source governance, managed cloud early access and negotiated private deployment. Transparent launch pricing in USD; price does not imply current service availability.</p><section><span>1</span><div><h2>What WhitePact offers</h2><p>WhitePact is an open-source trust and runtime governance platform for AI agents, with paid cloud and enterprise software/services for production deployment. These are digital products and services; no physical goods are sold.</p></div></section><section><span>2</span><div><h2>Annual billing</h2><p>2 months free with annual billing compared with twelve monthly payments. All prices are USD. Applicable taxes are calculated at checkout where required.</p></div></section><section><span>3</span><div><h2>Availability before payment</h2><p>Cloud Starter and Cloud Team are Early Access digital software/SaaS offerings, not immediately purchasable subscriptions. Contacting us does not charge you or activate a paid entitlement. Confirm the service scope and availability before purchase. No uptime guarantee, response-time commitment or certification is implied.</p></div></section><section><span>4</span><div><h2>Before you purchase</h2><p>Request a written quote using the contact link below. Review the agreed features, total price, taxes, billing period, renewal and cancellation terms before accepting. Subscription cancellation and refund requests are explained in the Refund Policy. Buying a plan never grants permission to bypass governance.</p></div></section><p><a href="mailto:annaduraiguruprasath7@gmail.com">Contact WhitePact</a></p><div class="launch-pricing" aria-label="Launch plans"><article><h3>Community</h3><span class="plan-status">Available</span><strong>$0 forever</strong><p>$0/year</p><p>MIT-licensed core governance for local development and self-managed use. Security fixes remain available to Community users.</p><a class="wp-button wp-button--secondary" href="https://github.com/Guruprasath-Annadurai/Whitepact#quick-start">Run locally</a></article><article><h3>Cloud Starter</h3><span class="plan-status">Early Access</span><strong>$29/month</strong><p>$290/year</p><p>For developers and small teams evaluating managed WhitePact. Hosted access and included capabilities must be confirmed before purchase.</p><a class="wp-button wp-button--secondary" href="/contact">Contact for Early Access</a></article><article><h3>Cloud Team</h3><span class="plan-status">Early Access</span><strong>$99/month</strong><p>$990/year</p><p>For teams evaluating managed WhitePact and organizational collaboration. Team workflows and service scope must be confirmed before purchase.</p><a class="wp-button wp-button--secondary" href="/contact">Contact for Early Access</a></article><article><h3>Enterprise / Private</h3><span class="plan-status">Contact Sales</span><strong>Custom</strong><p>Custom annual pricing</p><p>Evaluate private or self-hosted deployments with negotiated commercial deployment and support. Deliverables require a written agreement.</p><a class="wp-button wp-button--secondary" href="/contact">Contact Sales</a></article></div></main><footer class="subpage-footer"><nav aria-label="Public footer"><a href="/pricing">Pricing</a> <a href="/terms">Terms</a> <a href="/privacy">Privacy</a> <a href="/refund-policy">Refund Policy</a> <a href="/contact">Contact</a></nav></footer></noscript>
