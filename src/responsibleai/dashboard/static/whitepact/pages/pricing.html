    <div id="root"></div><noscript><header class="subpage-nav"><a href="/">WhitePact</a></header><main class="editorial-page"><h1>Pricing</h1><p class="page-lead">Compare free WhitePact Community software with contact-based pricing for cloud and enterprise digital software services.</p><section><span>1</span><div><h2>What WhitePact offers</h2><p>WhitePact is an open-source trust and runtime governance platform for AI agents, with paid cloud and enterprise software/services for production deployment. These are digital products and services; no physical goods are sold.</p></div></section><section><span>2</span><div><h2>Community / Open Source — Free</h2><p>Use the MIT-licensed software for local and self-hosted governance, including policy evaluation and governance evidence capabilities. Local/community development does not require WhitePact activation. You operate your infrastructure and remain responsible for its configuration. Community support is available through the project repository.</p></div></section><section><span>3</span><div><h2>WhitePact Cloud / Pro — Contact for current pricing</h2><p>Discuss hosted access, production API credentials and managed capabilities. Commercial availability, included capabilities, usage allowances, billing currency and recurring charges are confirmed in an order or checkout before purchase. A contact inquiry does not create a paid subscription. Self-service paid checkout is available only when production billing is configured.</p></div></section><section><span>4</span><div><h2>Enterprise / Private Deployment — Contact for current pricing</h2><p>Discuss private deployment, identity-provider integration and software support services. Deliverables, implementation scope and any support commitments are defined in a written agreement. No uptime guarantee, response-time commitment or certification is implied by this page.</p></div></section><section><span>5</span><div><h2>Official production deployment identity — Planned</h2><p>Signed official deployment identity is being integrated and is not offered as an available purchase entitlement today. It is distinct from customer authority and does not replace your organization&#39;s governance controls. Community use does not depend on this planned commercial capability.</p></div></section><section><span>6</span><div><h2>Before you purchase</h2><p>Request a written quote using the contact link below. Review the agreed features, total price, taxes, billing period, renewal and cancellation terms before accepting. Subscription cancellation and refund requests are explained in the Refund Policy. Buying a plan never grants permission to bypass governance.</p></div></section><p><a href="mailto:annaduraiguruprasath7@gmail.com">Contact WhitePact</a></p></main><footer class="subpage-footer"><nav aria-label="Public footer"><a href="/pricing">Pricing</a> <a href="/terms">Terms</a> <a href="/privacy">Privacy</a> <a href="/refund-policy">Refund Policy</a> <a href="/contact">Contact</a></nav></footer></noscript>
