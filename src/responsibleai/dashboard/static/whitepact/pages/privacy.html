    <div id="root"></div><noscript><header class="subpage-nav"><a href="/">WhitePact</a></header><main class="editorial-page"><h1>Privacy Policy</h1><p class="page-lead">How WhitePact handles account information, billing metadata, security events and submitted data, including self-hosted privacy boundaries.</p><section><span>1</span><div><h2>Scope and contact</h2><p>This policy describes data handling for the WhitePact website and services operated by WhitePact. For privacy questions or requests, contact annaduraiguruprasath7@gmail.com. Your organization may separately control data processed for its workspace and determine the purpose of that processing.</p></div></section><section><span>2</span><div><h2>Account and authentication data</h2><p>Hosted accounts may include your name, email address, organization and membership information, password verifier, session records and verification or password-reset records. We use these to authenticate users, manage access and communicate about accounts. API-key metadata includes identifiers, names, roles, verifier hashes, creation and usage information, rather than recoverable raw API-key secrets.</p></div></section><section><span>3</span><div><h2>Billing and support information</h2><p>When commercial billing is enabled, we process customer and subscription references, plan and payment-status metadata, billing events and information you provide for support. The billing provider identified at checkout handles payment details under its own privacy terms. The current billing integration uses Stripe; other providers may be identified for a future purchase. WhitePact does not store raw payment-card details.</p></div></section><section><span>4</span><div><h2>Submitted content and security events</h2><p>Hosted features may process content you submit for evaluation, resulting decisions and evidence, and operational or security records such as request timing, status and authentication events. Configured logging may include network identifiers. Submit only information necessary for your use case and which you are authorized to share. Public registry or incident submissions are intended for publication as described by those features; do not include confidential information in public submissions.</p></div></section><section><span>5</span><div><h2>Purposes and sharing</h2><p>We use information to provide requested functionality, protect accounts and organizations, investigate abuse, support users, administer billing and meet applicable legal obligations. We do not sell personal data or use submitted content to train our own models. Customer-selected model and integration providers receive data only through the features and connections used or configured by the customer.</p></div></section><section><span>6</span><div><h2>Self-hosted deployments</h2><p>Running Community or self-hosted software does not automatically send all agent activity, prompts or evidence to WhitePact. Your organization controls its infrastructure, database, secrets, telemetry configuration and enabled integrations. Data reaches WhitePact or another provider when you choose a hosted service, contact support or configure an integration that sends it. Direct requests concerning wholly self-hosted data to the organization operating that deployment.</p></div></section><section><span>7</span><div><h2>Cookies and telemetry</h2><p>The dashboard uses necessary authentication-session and CSRF cookies. The current public website does not include advertising or cross-site tracking. Operational telemetry depends on the service and deployment configuration; self-hosted operators control their own telemetry destinations. Disabling necessary cookies can prevent account functions from working.</p></div></section><section><span>8</span><div><h2>Service providers</h2><p>Hosted operation may use configured hosting, database, cache, email-delivery, identity and billing providers. Repository deployment configurations include Render, Supabase and Upstash; which providers process a particular deployment&#39;s data depends on its configuration. Customers can use their own identity and integration providers. Request current provider and processing details for a proposed hosted service before sending sensitive data. We may disclose information where legally required or necessary to address security threats.</p></div></section><section><span>9</span><div><h2>Retention</h2><p>We retain information for service delivery, account administration, security, dispute resolution and applicable legal or accounting requirements. Retention depends on the data category, deployment configuration and agreed terms. Closing an account does not immediately erase records that must be retained by law or for legitimate security purposes. Automated deletion is not guaranteed for every data category; contact us to discuss deletion or retention requirements before relying on a specific period.</p></div></section><section><span>10</span><div><h2>Security and international processing</h2><p>Controls include credential-verifier storage, access restrictions and secure-transport configuration; encryption and other protections depend on the deployment and feature configuration. No system is risk-free, and this policy is not a certification claim. Providers may process data in different countries. Ask for current processing locations and applicable transfer arrangements before purchasing a service with residency requirements.</p></div></section><section><span>11</span><div><h2>Your rights</h2><p>Subject to applicable law, you may request access, correction, deletion, restriction or portability of personal data, object to relevant processing, or withdraw consent where processing relies on it. Contact our privacy address; we may verify identity and workspace authority before acting. We respond under applicable legal requirements, and some records may be retained where legally permitted or required. You may raise concerns with the relevant data-protection authority.</p></div></section><section><span>12</span><div><h2>Children and policy updates</h2><p>WhitePact services are intended for adult users and organizational use, not children. Contact us if you believe a child has submitted personal information. We will update this page when practices change and provide additional notice where required by applicable law.</p></div></section><p><a href="mailto:annaduraiguruprasath7@gmail.com">Contact WhitePact</a></p></main><footer class="subpage-footer"><nav aria-label="Public footer"><a href="/pricing">Pricing</a> <a href="/terms">Terms</a> <a href="/privacy">Privacy</a> <a href="/refund-policy">Refund Policy</a> <a href="/contact">Contact</a></nav></footer></noscript>
