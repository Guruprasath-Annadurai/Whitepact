    <div id="root"></div><noscript><header><a href="/">WhitePact</a><nav aria-label="Primary navigation"><a href="/product">Product</a> <a href="/architecture">Architecture</a> <a href="/developers">Developers</a> <a href="/security">Security</a> <a href="/enterprise">Enterprise</a> <a href="/docs">Docs</a> <a href="/about">Company</a> <a href="/trust">Trust</a> <a href="/pricing">Pricing</a> <a href="/terms">Terms</a> <a href="/privacy">Privacy</a> <a href="/refund-policy">Refund Policy</a> <a href="/contact">Contact</a></nav></header><main id="static-main" class="editorial-page"><h1>Route supported actions through a governed boundary</h1><p class="page-lead">Connect supported API and MCP actions to WhitePact&#39;s configured governance boundary.</p><section><div><h2>Local setup</h2><p>Clone https://github.com/Guruprasath-Annadurai/Whitepact.git, check out 52d9b3c5497af24bb7d4a7147e33deaadc64296e, run pip install -e &quot;.[dashboard]&quot; in that checkout, then start uvicorn responsibleai.dashboard.app:app on localhost. The published distribution was 1.2.6 when checked on 2026-10-04 and may differ from this source baseline. Follow database, encryption and authority prerequisites before consequential testing.</p></div></section><section><div><h2>Authentication is not authority</h2><p>Bearer credentials authenticate requests but do not establish root legitimacy, consent or execution authority.</p></div></section><section><div><h2>Result handling</h2><p>Approval required is pending, denial is not success, and UNKNOWN means the downstream effect is uncertain. Do not retry UNKNOWN automatically.</p></div></section><section><div><h2>Interfaces</h2><p>POST /api/v1/governance/tools/call requires an organization-scoped API key authorized for at least the ANALYST role and a supported tool. Use deployed /mcp for compatible Streamable HTTP clients. Bearer integrations list evidence at GET /api/governance/evidence; GET /api/web/evidence/EVIDENCE_ID requires an authenticated browser session and organization membership. Baseline SDK evidence-detail helpers reference an unavailable route. Review exact deployed schemas at /api/docs.</p></div></section><p><a href="/contact">Discuss an evaluation</a></p></main><footer><nav aria-label="Public footer"><a href="/product">Product</a> <a href="/architecture">Architecture</a> <a href="/developers">Developers</a> <a href="/security">Security</a> <a href="/enterprise">Enterprise</a> <a href="/docs">Docs</a> <a href="/about">Company</a> <a href="/trust">Trust</a> <a href="/pricing">Pricing</a> <a href="/terms">Terms</a> <a href="/privacy">Privacy</a> <a href="/refund-policy">Refund Policy</a> <a href="/contact">Contact</a></nav></footer></noscript>
