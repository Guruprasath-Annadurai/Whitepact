# Disposable PostgreSQL 16 for the test suite. NOT for any real data.
#
#   scripts/test-postgres.sh up      # start and wait until healthy
#   eval "$(scripts/test-postgres.sh env)"
#   pytest tests/test_historical_postgres_migrations.py tests/test_auth_real_postgres.py ...
#   scripts/test-postgres.sh down    # remove container and data
#
# Credentials are test-only and the port is bound to loopback. Data lives in tmpfs so
# every `up` starts from an empty server; tests create and drop their own uniquely named
# databases (tests/pg_test_url.py). PostgreSQL 16 matches the canonical CI matrix. The
# image is pinned by digest; update the digest deliberately, not implicitly.
name: whitepact-test-postgres

services:
  postgres-test:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: wp
      POSTGRES_PASSWORD: wp
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    shm_size: 256m
    command: ["postgres", "-c", "fsync=off", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wp -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
