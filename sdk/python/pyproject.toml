[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rai-client"
dynamic = ["version"]
description = "Python HTTP client SDK for the WhitePact governance platform"
license = { file = "LICENSE" }
authors = [{ name = "Guruprasath Annadurai", email = "annaduraiguruprasath7@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0"]

[project.urls]
Homepage = "https://github.com/Guruprasath-Annadurai/Whitepact"

[tool.hatch.build.targets.wheel]
packages = ["rai_client"]

[tool.hatch.version]
path = "rai_client/_version.py"
