# WhitePact origin TLS listener.
# Authenticated Origin Pull is enforced here. The Hetzner load balancer
# forwards TCP and cannot restrict port 443 to Cloudflare addresses.
# Application HSTS is authoritative; this file does not set Strict-Transport-Security.

server {
    listen 443 ssl;
    http2 on;
    server_name staging.example.invalid;

    ssl_certificate     /etc/whitepact/origin/server.crt;
    ssl_certificate_key /etc/whitepact/origin/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    ssl_client_certificate /etc/whitepact/origin/cloudflare-aop-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /livez {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
