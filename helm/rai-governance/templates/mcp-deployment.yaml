{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rai-governance.mcp.fullname" . }}
  labels:
    {{- include "rai-governance.mcp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.mcp.autoscaling.enabled }}
  replicas: {{ .Values.mcp.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "rai-governance.mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- /*
        Deliberately NOT .Values.podAnnotations: that block hardcodes
        prometheus.io/port: "8765", the dashboard's port. This process
        listens on 8766 and doesn't expose /metrics at all today, so
        reusing it verbatim would tell Prometheus to scrape a port these
        pods don't serve. Use .Values.mcp.podAnnotations instead (empty
        by default, honestly, until this process has real metrics to scrape).
        */}}
        {{- with .Values.mcp.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rai-governance.mcp.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rai-governance.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp-http
          command: ["responsibleai-mcp-http"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.mcp.image.repository | default .Values.image.repository }}:{{ .Values.mcp.image.tag | default .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy | default .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8766
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "rai-governance.fullname" . }}
            {{- if or .Values.config.apiKeys (and .Values.oidc.enabled (not .Values.oidc.existingSecret)) }}
            - secretRef:
                name: {{ include "rai-governance.fullname" . }}
            {{- end }}
            {{- if and .Values.oidc.enabled .Values.oidc.existingSecret }}
            - secretRef:
                name: {{ .Values.oidc.existingSecret }}
            {{- end }}
          env:
            # Not shared with the dashboard's configmap on purpose: these
            # two are specific to the MCP HTTP transport's own bind
            # address/port (mcp/server.py's main_http()), unrelated to
            # anything the dashboard process reads.
            - name: RAI_MCP_HTTP_HOST
              value: "0.0.0.0"
            - name: RAI_MCP_HTTP_PORT
              value: "8766"
            {{- with .Values.mcp.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.mcp.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.mcp.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - {{ include "rai-governance.name" . }}-mcp
                topologyKey: kubernetes.io/hostname
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
