## Default values for rai-governance.
## Override with: helm install rai ./helm/rai-governance -f my-values.yaml

replicaCount: 2

## Zero-downtime rollout — maxUnavailable: 0 guarantees full capacity is
## maintained during a deploy (paired with the PDB below); relying on
## Kubernetes' own default (25%/25%) risks a capacity drop with low
## replica counts due to percentage rounding.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  repository: ghcr.io/guruprasath-annadurai/responsibleai
  pullPolicy: IfNotPresent
  tag: "1.2.4rc1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "8765"

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8765

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: rai.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: rai-tls
      hosts:
        - rai.example.com

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

## Pod Disruption Budget — keep at least 1 pod available during rolling updates
pdb:
  enabled: true
  minAvailable: 1

## Liveness / readiness probes
livenessProbe:
  httpGet:
    path: /api/live
    port: 8765
  initialDelaySeconds: 15
  periodSeconds: 20
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/ready
    port: 8765
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - rai-governance
          topologyKey: kubernetes.io/hostname

## Application configuration — maps to preferred WHITEPACT_* env vars
config:
  ## Existing Secret containing WHITEPACT_DATABASE_URL and
  ## WHITEPACT_REDIS_URL. Recommended for production.
  existingSecret: ""
  ## Fail closed on unsafe production-only settings.
  productionMode: false
  ## Set true whenever more than one process/replica serves traffic.
  multiReplica: true
  ## Disable when multiReplica=true and run migrations as a release job.
  autoMigrate: false
  ## Enforce the Heart governance path for hosted MCP calls.
  mcpGovernanceEnabled: true
  ## Resolve hosted calls through persisted Heart legitimacy state.
  heartEnforcementEnabled: true
  ## Set to false to allow unauthenticated access (development only)
  authEnabled: true
  ## Comma-separated static API keys (prefer DB-backed keys for production)
  apiKeys: ""
  ## Alert threshold for trust score drift (points)
  alertThreshold: "5.0"
  ## Monthly AI spending budget
  monthlyBudgetUsd: "10000.0"
  ## Log level: DEBUG, INFO, WARNING, ERROR
  logLevel: "INFO"
  ## Emit JSON-formatted logs
  logJson: "true"
  ## PostgreSQL URL — leave empty to use embedded SQLite
  databaseUrl: ""
  ## Redis URL for distributed rate limiting
  redisUrl: ""
  ## Canonical hosted MCP OAuth audience/resource identifier.
  mcpOauthResourceUri: ""
  ## OAuth scopes required on every hosted MCP access token.
  mcpOauthScopes: "mcp:tools"
  mcpOauthResourceDocumentation: "https://github.com/Guruprasath-Annadurai/ResponsibleAi/blob/main/MIGRATION_WHITEPACT_V2.md"
  ## OpenTelemetry OTLP endpoint
  otelEndpoint: ""

## Run schema migrations exactly once before each install/upgrade. Required
## when config.autoMigrate=false (the production multi-replica default).
migrations:
  enabled: false
  backoffLimit: 2
  activeDeadlineSeconds: 600

## OIDC / SSO configuration (optional)
oidc:
  enabled: false
  issuer: ""
  clientId: ""
  ## Prefer existingSecret in production. This inline value is for local
  ## chart evaluation only and is rendered into a Kubernetes Secret.
  clientSecret: ""
  redirectUri: ""
  scopes: "openid,email,profile"
  ## Secret name containing WHITEPACT_OIDC_CLIENT_SECRET
  existingSecret: ""

## Persistent storage for SQLite (ignored when databaseUrl is set)
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /data

## Extra environment variables
extraEnv: []
## - name: MY_VAR
##   value: my-value

## Extra volumes / volume mounts
extraVolumes: []
extraVolumeMounts: []

## Hosted MCP transport (Streamable HTTP + legacy HTTP/SSE, see
## MIGRATION_WHITEPACT_V2.md Section 7) -- a separate Deployment from the
## dashboard above, sharing its configmap/secret (both processes read the
## same Settings class) but with its own replica count, autoscaling, and
## PDB: MCP tool-call traffic and dashboard HTTP traffic scale
## independently, and previously this process had no Helm-deployable, HA
## story at all (docker-compose.prod.yml's mcp-http service was the only
## place it existed as a deployable unit).
mcp:
  enabled: true
  replicaCount: 2
  ## No default scrape annotations -- this process doesn't expose /metrics
  ## yet (unlike the dashboard). Set this once/if it does.
  podAnnotations: {}
  image:
    ## Empty values fall back to the dashboard's .image.repository/.tag
    ## above -- same container image, different command (responsibleai-mcp-http).
    repository: ""
    tag: ""
    pullPolicy: ""
  service:
    type: ClusterIP
    port: 80
    targetPort: 8766
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  ## Keep at least 1 pod available during rolling updates, same rationale
  ## as the dashboard's pdb above.
  pdb:
    enabled: true
    minAvailable: 1
  livenessProbe:
    httpGet:
      path: /live
      port: 8766
    initialDelaySeconds: 15
    periodSeconds: 20
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /ready
      port: 8766
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  extraEnv: []
