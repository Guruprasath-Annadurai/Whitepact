#cloud-config
# NAT + management gateway — IP forwarding and masquerade for private-network egress.
# Forwarding is source-tier and destination allowlisted. A private tier cannot use another tier's destinations.
write_files:
  - path: /etc/ssh/sshd_config.d/99-whitepact-admin.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
  - path: /etc/nftables.d/whitepact-nat.nft
    permissions: "0644"
    content: |
      table inet whitepact_nat {
        chain input {
          type filter hook input priority 0; policy drop;
          ct state established,related accept
          iif "lo" accept
          udp sport 67 udp dport 68 accept comment "DHCP reply"
          tcp dport 22 ip saddr { ${admin_cidrs} } accept comment "operator SSH"
        }
        chain forward {
          type filter hook forward priority 0; policy drop;
          ct state established,related accept
          ${forward_rules}
        }
        chain output {
          type filter hook output priority 0; policy accept;
        }
        chain postrouting {
          type nat hook postrouting priority 100; policy accept;
          oifname "${public_iface}" masquerade comment "NAT for private nodes"
        }
      }
  - path: /etc/nftables.conf
    permissions: "0644"
    content: |
      #!/usr/sbin/nft -f
      flush ruleset
      include "/etc/nftables.d/whitepact-nat.nft"
runcmd:
  - [bash, -lc, "sysctl -w net.ipv4.ip_forward=1"]
  - [bash, -lc, "grep -q '^net.ipv4.ip_forward=1' /etc/sysctl.d/99-whitepact-nat.conf || echo 'net.ipv4.ip_forward=1' >> /etc/sysctl.d/99-whitepact-nat.conf"]
  - [bash, -lc, "mkdir -p /etc/nftables.d && nft -f /etc/nftables.conf"]
  - [systemctl, enable, nftables]
  - [systemctl, restart, nftables]
  - [bash, -lc, "systemctl reload ssh || systemctl reload sshd || true"]
