[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rai-governance-platform"
version = "1.2.0"
description = "ResponsibleAI — Enterprise AI Governance Platform: trust scoring, bias detection, hallucination detection, guardrails, compliance (NIST AI RMF / EU AI Act / ISO 42001), cost intelligence, drift monitoring"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Guruprasath Annadurai", email = "milchcreamfoods@gmail.com" }]
keywords = [
    "llm", "bias", "fairness", "responsible-ai", "ai-governance",
    "federated-learning", "differential-privacy", "deepfake-detection",
    "hallucination", "guardrails", "compliance", "eu-ai-act", "nist-ai-rmf",
    "iso-42001", "ai-safety", "ai-trust", "red-teaming", "pii-detection",
    "cost-intelligence", "token-tracking", "drift-detection", "model-routing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "anyio>=4.0.0",
    # <2.0.0: the official MCP Python SDK's 2.0.0 release renamed
    # types.Tool's inputSchema kwarg to input_schema, types.Resource's
    # mimeType to mime_type, and relocated AnyUrl -- a real breaking
    # change, not a false-positive mypy issue. Every tool/resource
    # definition in mcp/tools.py and mcp/resources.py uses the pre-2.0
    # camelCase kwargs; migrating ~27 tool defs + 10 resource defs to the
    # new API is real, separate work with its own test pass, not
    # something to fold into an unrelated commit. Bump this pin (and
    # migrate the kwargs) deliberately, in its own change.
    "mcp>=1.0.0,<2.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "slowapi>=0.1.9",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "websockets>=12.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "pyotp>=2.9.0",
]
postgres   = ["asyncpg>=0.29.0"]
redis      = ["limits[redis]>=3.6.0"]
telemetry  = [
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
]
sso        = ["PyJWT[crypto]>=2.8.0", "httpx>=0.27.0"]
openai     = ["openai>=1.30.0"]
anthropic  = ["anthropic>=0.28.0"]
google     = ["google-generativeai>=0.5.0"]
leaderboard = ["rai-governance-platform[dashboard,openai,anthropic,google]"]
huggingface = ["transformers>=4.40.0", "torch>=2.0.0"]
privacy    = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
deepfake   = ["torch>=2.0.0", "torchvision>=0.15.0", "pillow>=10.0.0", "opencv-python>=4.8.0"]
all        = ["rai-governance-platform[dashboard,postgres,redis,telemetry,openai,anthropic,google,huggingface,deepfake,sso]"]
mcp        = ["mcp>=1.0.0,<2.0.0"]
billing    = ["stripe>=9.0.0"]
# Agent-framework integrations (src/responsibleai/integrations/) — the
# rai_check_trust MCP tool and its LangChain/LangGraph/ADK adapters.
# Opt-in: these are heavy, fast-moving dependencies with no place in a
# default install. Verified against langchain 1.3.14, langgraph 1.2.9,
# google-adk 2.5.0 as of this writing (2026-07-25).
langchain  = ["langchain>=1.0.0"]
langgraph  = ["langgraph>=1.0.0"]
adk        = ["google-adk>=2.0.0"]
agent-frameworks = ["rai-governance-platform[langchain,langgraph,adk]"]
# Optional VADER sentiment-divergence scoring (src/biasbuster/core/scoring.py).
# Not installed by default: nltk has an open path-traversal advisory
# (PYSEC-2026-597 / CVE-2026-12243) with no fixed release as of this writing.
# Our only call site passes the hardcoded literal "vader_lexicon" to
# nltk.download() — never an attacker-controlled resource name — so this
# codebase does not trigger the vulnerable path. Still opt-in only, so a
# default install never carries the finding; installing this extra takes on
# that (mitigated-here, unpatched-upstream) risk knowingly.
sentiment  = ["nltk>=3.9.4"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "PyJWT[crypto]>=2.8.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "asgi-lifespan>=2.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "slowapi>=0.1.9",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "websockets>=12.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "mcp>=1.0.0,<2.0.0",
    "pyotp>=2.9.0",
    "langchain>=1.0.0",
    "langgraph>=1.0.0",
    "google-adk>=2.0.0",
]

[project.scripts]
# Legacy names — unchanged, kept for backward compatibility per
# MIGRATION_WHITEPACT_V2.md Section 4. No planned removal date.
biasbuster        = "biasbuster.cli:main"
responsibleai     = "biasbuster.cli:main"
responsibleai-mcp = "responsibleai.mcp.server:main"
responsibleai-mcp-http = "responsibleai.mcp.server:main_http"
# Preferred names — identical entry-point functions, new invocation name only.
whitepact          = "biasbuster.cli:main"
whitepact-mcp       = "responsibleai.mcp.server:main"
whitepact-mcp-http  = "responsibleai.mcp.server:main_http"

[project.urls]
Homepage   = "https://github.com/Guruprasath-Annadurai/Whitepact"
Repository = "https://github.com/Guruprasath-Annadurai/Whitepact"
Issues     = "https://github.com/Guruprasath-Annadurai/Whitepact/issues"
Changelog  = "https://github.com/Guruprasath-Annadurai/Whitepact/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/biasbuster", "src/privacylabel", "src/responsibleai", "src/whitepact"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "--cov=src/responsibleai --cov=src/biasbuster --cov=src/privacylabel --cov-report=term-missing --cov-report=html"

[tool.ruff]
target-version = "py311"
line-length    = 100
src            = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = ["E501", "B008", "N802"]

[tool.mypy]
# No python_version pin: CI runs this against both 3.11 and 3.12 (see
# .github/workflows/ci.yml's matrix). Pinning to 3.11 made mypy refuse to
# parse numpy's own stub file under the 3.12 job -- numpy's stub uses
# PEP 695 `type X = ...` syntax, valid only when mypy's target version is
# 3.12+, so a fixed 3.11 pin broke type-checking on a dependency's stub,
# not on this project's own code. Letting mypy default to the running
# interpreter's version means each matrix job checks against itself.
ignore_missing_imports = true
mypy_path = "src"
