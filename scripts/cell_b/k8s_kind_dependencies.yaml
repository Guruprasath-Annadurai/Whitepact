# Disposable dependencies for Cell B kind qualification.
apiVersion: v1
kind: Namespace
metadata:
  name: cell-b-qual
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cell-b-qual
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cell-b-qual
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: wp
            - name: POSTGRES_PASSWORD
              value: wp
            - name: POSTGRES_DB
              value: whitepact
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cell-b-qual
spec:
  ports:
    - port: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cell-b-qual
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
