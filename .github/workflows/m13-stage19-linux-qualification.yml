name: M13 Stage 19 Linux qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage19:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: wp
          POSTGRES_PASSWORD: wp
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U wp" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: src:.
      WHITEPACT_TEST_PG_ADMIN_URL: postgresql://wp:wp@127.0.0.1:55432/postgres
      WHITEPACT_ISOLATION_IMAGE: python:3.11-slim
      WHITEPACT_REQUIRE_DOCKER_ISOLATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Record the checked-out source
        run: |
          set -eu
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          head=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          test "$head" = "$expected"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          Path("/tmp/stage19-source.json").write_text(json.dumps({
              "format": "WHITEPACT-M13-STAGE19-CI-SOURCE-V1",
              "head": head,
              "tree": tree,
              "github_sha": os.environ["GITHUB_SHA"],
              "ref": os.environ.get("GITHUB_REF", ""),
              "registry_admission": False,
          }, indent=2) + "\n")
          print(head, tree)
          PY
      - name: Install qualification prerequisites
        run: |
          python -m pip install -r tests/requirements-m11.txt
          python -m pip install '.[dashboard,postgres,mcp]'
          sudo apt-get update
          sudo apt-get install -y acl
          setfacl --version
          getfacl --version
          docker info
          docker pull python:3.11-slim
      - name: Build the WhitePact isolation image for this commit
        env:
          WHITEPACT_TEST_RUNTIME_IMAGE: whitepact-isolated-runtime:${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker build -f Dockerfile.isolation -t "$WHITEPACT_TEST_RUNTIME_IMAGE" .
          docker image inspect --format '{{.Id}}' "$WHITEPACT_TEST_RUNTIME_IMAGE" > /tmp/stage19-image-id.txt
          docker image inspect --format '{{json .RepoDigests}}' "$WHITEPACT_TEST_RUNTIME_IMAGE" > /tmp/stage19-image-repodigests.json
          python - <<'PY'
          import json
          from pathlib import Path
          image_id = Path("/tmp/stage19-image-id.txt").read_text().strip()
          repo_digests = json.loads(Path("/tmp/stage19-image-repodigests.json").read_text() or "[]")
          Path("/tmp/stage19-image.json").write_text(json.dumps({
              "format": "WHITEPACT-M13-STAGE19-CI-IMAGE-V1",
              "image": __import__("os").environ["WHITEPACT_TEST_RUNTIME_IMAGE"],
              "image_id": image_id,
              "repo_digests": repo_digests,
              "registry_admission": False,
              "note": "Local image id is not a signed registry admission.",
          }, indent=2) + "\n")
          if not image_id.startswith("sha256:"):
              raise SystemExit("image id missing")
          PY
      - name: Run the six Stage 19 tests
        env:
          WHITEPACT_TEST_RUNTIME_IMAGE: whitepact-isolated-runtime:${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m pytest \
            tests/test_m13_stage19_linux_qualification.py \
            tests/test_m13_execution_isolation_recovery.py::test_19_real_contained_execution \
            -q --tb=short -ra --override-ini=addopts= --no-cov \
            --junitxml=/tmp/stage19-junit.xml
          python - <<'PY'
          import xml.etree.ElementTree as E
          root = E.parse("/tmp/stage19-junit.xml").getroot()
          suites = list(root.iter("testsuite"))
          if not suites:
              raise SystemExit("JUnit suite missing")
          suite = suites[0]
          tests = int(suite.attrib.get("tests", "0"))
          skipped = int(suite.attrib.get("skipped", "0"))
          failures = int(suite.attrib.get("failures", "0"))
          errors = int(suite.attrib.get("errors", "0"))
          if tests != 6 or skipped or failures or errors:
              raise SystemExit(f"refusing result tests={tests} skipped={skipped} failures={failures} errors={errors}")
          print("stage19 junit accepted", tests)
          PY
      - name: Publish receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage19-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/stage19-source.json
            /tmp/stage19-image.json
            /tmp/stage19-junit.xml
