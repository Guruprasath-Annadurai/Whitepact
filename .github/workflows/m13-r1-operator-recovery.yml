name: M13 R1 Offline Operator Recovery

on:
  push:
    branches: [codex/whitepact-m13-r1-operator-recovery]
  pull_request:
    paths:
      - 'src/responsibleai/data_governance/operator_recovery*.py'
      - 'src/responsibleai/data_governance/backup_defense.py'
      - 'src/responsibleai/ops/operator_recovery.py'
      - 'tests/test_operator_recovery_*.py'
      - '.github/workflows/m13-r1-operator-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: wp
          POSTGRES_PASSWORD: wp
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U wp" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: src:sdk/python:.
      WHITEPACT_TEST_PG_ADMIN_URL: postgresql://wp:wp@127.0.0.1:55432/postgres
      WHITEPACT_R1_TEST_IMAGE: python:3.12-slim@sha256:7a8b475003c4fe15a2cd4e55e5cfc2f3560bdc9333d624f24cdd6d4340fd7a17
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated qualification dependencies
        run: |
          python -m pip install -r tests/requirements-m11.txt
          python -m pip install '.[dashboard,postgres,mcp,sso]' ruff==0.17.0 mypy
          docker pull "$WHITEPACT_R1_TEST_IMAGE"
          git rev-parse HEAD 'HEAD^{tree}' 'HEAD^' > /tmp/r1-source.txt
      - name: Preserve provenance and static policies
        run: |
          ruff check tests/test_final_deletion_adversarial.py tests/test_combined_deletion_containment.py tests/test_codex_fortress_recovery_qualification.py
          ruff format --check tests/test_final_deletion_adversarial.py tests/test_combined_deletion_containment.py tests/test_codex_fortress_recovery_qualification.py
          python scripts/engineering/m13_approved_formatting.py
          python scripts/check_pinned_actions.py
          python scripts/manage_license_headers.py --check
          ruff check src/responsibleai/data_governance/operator_recovery.py src/responsibleai/data_governance/operator_recovery_control.py src/responsibleai/data_governance/backup_defense.py src/responsibleai/data_governance/deletion_orchestrator.py src/responsibleai/data_governance/tenant_provisioning.py src/responsibleai/ops/operator_recovery.py tests/test_operator_recovery_*.py tests/test_stage3_lifecycle_integrity.py tests/test_stage3_pending_reservations.py tests/test_stage3_deletion_identity.py
          ruff format --check src/responsibleai/data_governance/operator_recovery.py src/responsibleai/data_governance/operator_recovery_control.py src/responsibleai/data_governance/backup_defense.py src/responsibleai/data_governance/deletion_orchestrator.py src/responsibleai/data_governance/tenant_provisioning.py src/responsibleai/ops/operator_recovery.py tests/test_operator_recovery_*.py tests/test_stage3_lifecycle_integrity.py tests/test_stage3_pending_reservations.py tests/test_stage3_deletion_identity.py
          mypy src/responsibleai/data_governance/operator_recovery.py src/responsibleai/data_governance/operator_recovery_control.py src/responsibleai/data_governance/tenant_provisioning.py src/responsibleai/ops/operator_recovery.py
          ruff check src/responsibleai/data_governance/provisioning_manifest.py src/responsibleai/data_governance/tenant_*.py tests/stage3_controller_helpers.py tests/test_stage3_*.py migrations/versions/0067_tenant_provisioning.py scripts/engineering/m13_bootstrap_preflight.py
          ruff format --check src/responsibleai/data_governance/provisioning_manifest.py src/responsibleai/data_governance/tenant_*.py tests/stage3_controller_helpers.py tests/test_stage3_*.py migrations/versions/0067_tenant_provisioning.py scripts/engineering/m13_bootstrap_preflight.py
          mypy scripts/engineering/m13_bootstrap_preflight.py
          mypy src/responsibleai/data_governance/provisioning_manifest.py src/responsibleai/data_governance/tenant_admission.py src/responsibleai/data_governance/tenant_client.py src/responsibleai/data_governance/tenant_controller.py src/responsibleai/data_governance/tenant_controller_server.py
      - name: Real stores, native Docker and process-crash matrix
        run: |
          python -m pytest tests/test_operator_recovery_authorization.py tests/test_operator_recovery_ledger.py tests/test_operator_recovery_direct_calls.py tests/test_operator_recovery_postgres.py tests/test_operator_recovery_crash.py tests/test_operator_recovery_startup.py tests/test_stage3_*.py tests/test_m13_referenced_approval_deletion.py tests/test_codex_fortress_recovery_qualification.py tests/test_combined_deletion_containment.py tests/test_final_deletion_adversarial.py -o addopts='' --junitxml=/tmp/r1-recovery.xml --tb=short -ra
          python -c 'import xml.etree.ElementTree as E; r=E.parse("/tmp/r1-recovery.xml"); assert not list(r.iter("skipped")) and not list(r.iter("failure")) and not list(r.iter("error"))'
      - name: Unchanged restore and journal neighbors
        if: ${{ !cancelled() }}
        run: |
          python -m pytest tests/test_restore_reconciliation.py tests/test_restore_admission_chokepoint.py tests/test_h4_backup_recovery_adversarial.py tests/test_m13_final_production_restore.py tests/test_m13_approved_reproducer_provenance.py tests/test_m13_absolute_durable_intent.py tests/test_m13_absolute_runtime_inventory.py tests/test_tenant_deletion.py tests/test_erasure.py -o addopts='' --junitxml=/tmp/r1-neighbors.xml --tb=short -ra
          python -c 'import xml.etree.ElementTree as E; r=E.parse("/tmp/r1-neighbors.xml"); assert not list(r.iter("skipped")) and not list(r.iter("failure")) and not list(r.iter("error"))'
      - name: Retain exact-source receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m13-r1-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/r1-source.txt
            /tmp/r1-recovery.xml
            /tmp/r1-neighbors.xml
