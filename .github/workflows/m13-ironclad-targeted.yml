name: M13 Ironclad Targeted Diagnosis

on:
  push:
    branches: [codex/whitepact-m13-ironclad, codex/whitepact-m13-final-convergence]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: ["3.11", "3.12"]
    env:
      PYTHONPATH: src:sdk/python:.
      PLAYWRIGHT_BROWSERS_PATH: /tmp/whitepact-m13-ironclad-chromium
      WHITEPACT_REDIS_URL: redis://127.0.0.1:6379/0
      WHITEPACT_REQUIRE_REDIS: "1"
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: wp
          POSTGRES_PASSWORD: wp
          POSTGRES_DB: whitepact_e2e
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U wp -d whitepact_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Record exact source and dependency environment
        run: |
          mkdir -p /tmp/ironclad
          git rev-parse HEAD 'HEAD^{tree}' 'HEAD^' > /tmp/ironclad/provenance.txt
          git status --porcelain=v1 >> /tmp/ironclad/provenance.txt
          python -m pip install --upgrade pip setuptools build
          python -m pip install 'hatchling==1.32.0'
          python -m pip install -e ".[dev,openai,anthropic,sso,sentiment,postgres,redis]"
          python -m pip install -r tests/requirements-wave1-frameworks.txt
          python -m pip install 'pytest-timeout>=2.3,<3'
          python -m pip freeze --all > /tmp/ironclad/dependencies.txt
      - name: Install Linux cohort prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 nginx acl
          docker build --iidfile "$RUNNER_TEMP/m13-isolation-image.id" -f Dockerfile.isolation -t whitepact-isolated-runtime:ci .
          python scripts/engineering/m13_admit_qualification_image.py --iid-file "$RUNNER_TEMP/m13-isolation-image.id" --github-env "$GITHUB_ENV"
          docker version > /tmp/ironclad/docker-version.txt
          cli_version=$(docker version --format '{{.Client.Version}}')
          curl --fail --silent --show-error --max-time 30 "https://raw.githubusercontent.com/docker/cli/v$cli_version/cli/command/container/create.go" -o /tmp/ironclad/docker-cli-create.go
          curl --fail --silent --show-error --max-time 30 "https://raw.githubusercontent.com/docker/cli/v$cli_version/cli/command/container/run.go" -o /tmp/ironclad/docker-cli-run.go
          sha256sum /tmp/ironclad/docker-cli-*.go > /tmp/ironclad/docker-cli-source-sha256.txt
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix sdk/typescript ci --ignore-scripts --no-audit --no-fund
          npm --prefix sdk/typescript run build
          npx playwright install --with-deps chromium
      - name: Ownership and signed A2 mutation regressions
        if: ${{ !cancelled() }}
        run: |
          python -m pytest tests/test_m13_ironclad_ownership.py tests/test_m13_ironclad_a2_mutation.py tests/test_m13_ironclad_authority_contracts.py tests/test_m13_ironclad_identity_contracts.py tests/test_m13_ironclad_upstream_admission.py tests/test_m13_ironclad_task_diagnostics.py tests/test_m13_ironclad_cpu_profile.py tests/test_sovereign_authority.py tests/test_m13_convergence_a2.py -o addopts= --timeout=120 --timeout-method=signal --cov=src/responsibleai --cov-branch --cov-report=json:/tmp/ironclad/targeted-coverage.json --junitxml=/tmp/ironclad/authority.xml -ra > /tmp/ironclad/authority.log 2>&1
      - name: Reproduce CPU RED on the preserved source with the same immutable image
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          observer="$PWD/scripts/engineering/m13_ironclad_cpu_profile.py"
          git rev-parse HEAD:scripts/engineering/m13_ironclad_cpu_profile.py > /tmp/ironclad/profile-observer-blob.txt
          git worktree add --detach /tmp/whitepact-ironclad-cpu-baseline d9ddf44afa64fade5eb5805b03696b92533e0924
          set +e
          (cd /tmp/whitepact-ironclad-cpu-baseline && PYTHONPATH=src:sdk/python:. python "$observer" --output /tmp/ironclad/cpu-baseline --repetitions 5 --timeout 180 -- -q -o addopts= --timeout=120 --timeout-method=signal)
          baseline_exit=$?
          set -e
          BASELINE_PROFILE_EXIT="$baseline_exit" python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('/tmp/ironclad/cpu-baseline')
          assert os.environ['BASELINE_PROFILE_EXIT'] == '1'
          summary = json.loads((root/'summary.json').read_text())
          assert summary['provenance']['head'] == 'd9ddf44afa64fade5eb5805b03696b92533e0924'
          assert summary['provenance']['git_status'] == ''
          assert len(summary['runs']) == 5
          for row in summary['runs']:
              assert row['status'] == 'FAIL' and row['provenance_matches']
              receipt = json.loads((root/row['receipt']).read_text())
              assert len(receipt['executions']) == 1
              execution = receipt['executions'][0]
              assert execution['timed_out'] and execution['outcome_duration_seconds'] >= 3
              assert receipt['cleanups'] and receipt['cleanups'][0]['stable_seconds'] == 3
              failures = [r for r in receipt['pytest_reports'] if r['outcome'] == 'failed']
              assert len(failures) == 1 and failures[0]['phase'] == 'call'
          print('Five original CPU failures reproduced; these remain RED test results.')
          PY
      - name: Independent final integration admission and original owner counterexamples
        if: ${{ !cancelled() }}
        run: |
          python -m pytest tests/test_m13_final_admission.py tests/test_m13_final_http_admission.py tests/test_m13_final_detached_identity.py tests/test_m13_final_container_identity.py tests/test_m13_final_gate_isolation.py tests/test_m13_final_late_receipt.py tests/test_m13_final_production_restore.py tests/test_m13_final_cross_tenant_restore.py scripts/engineering/reproducers/test_m13_final_owner_review.py -o addopts= --timeout=120 --timeout-method=signal --junitxml=/tmp/ironclad/final-contracts.xml -vv -ra --tb=short > /tmp/ironclad/final-contracts.log 2>&1
      - name: Replay unchanged recovery tests and imported owner-focused contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          fresh_registry=$(mktemp -d)
          TMPDIR="$fresh_registry" python -m pytest tests/test_h4_backup_recovery_adversarial.py scripts/engineering/reproducers/test_m13_fortress_restore_independent.py tests/test_m13_recovery_zero_p0_reproducers.py -o addopts= --timeout=120 --timeout-method=signal --junitxml=/tmp/ironclad/final-recovery.xml -vv -ra --tb=short > /tmp/ironclad/final-recovery.log 2>&1
      - name: Container ownership, cancellation and native Linux regressions
        if: ${{ !cancelled() }}
        env:
          WHITEPACT_REQUIRE_DOCKER_ISOLATION: "1"
        run: |
          python -m pytest tests/test_m13_final_native_recovery.py tests/test_m13_ironclad_native_contracts.py tests/test_m13_ironclad_container_ownership.py tests/test_m13_ironclad_registration_cancellation.py tests/test_final_coverage_batch16.py::test_container_execute_reads_cidfile_for_cleanup tests/test_container_cleanup_race_adversarial.py tests/test_isolation_container_backend_branches.py tests/test_docker_container_lifecycle.py scripts/engineering/reproducers/test_m13_dual_titan_cancellation.py tests/test_h2_linux_containment_adversarial.py tests/test_p0_linux_containment.py tests/test_isolation_real_tool_e2e.py -o addopts= --timeout=120 --timeout-method=signal --junitxml=/tmp/ironclad/container.xml -vv -ra --tb=short > /tmp/ironclad/container.log 2>&1
      - name: Profile unchanged CPU bound on the candidate isolated runtime
        if: ${{ !cancelled() }}
        run: |
          docker version > /tmp/ironclad/docker-version.txt
          docker image inspect whitepact-isolated-runtime:ci --format '{{.Id}}' > /tmp/ironclad/runtime-image.txt
          python scripts/engineering/m13_ironclad_cpu_profile.py --output /tmp/ironclad/cpu-profile --repetitions 5 --timeout 180 -- -q -o addopts= --timeout=120 --timeout-method=signal
      - name: Repeat original route-limit file in isolated processes
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          result=0
          for iteration in 1 2 3; do
            python scripts/engineering/m13_ironclad_task_diagnostics.py tests/test_plan_scaled_route_limits.py -o addopts= --timeout=120 --timeout-method=signal -o faulthandler_timeout=90 --junitxml=/tmp/ironclad/route-$iteration.xml -vv -ra > /tmp/ironclad/route-$iteration.log 2>&1 || result=1
          done
          exit "$result"
      - name: Reproduce original shard-zero cohort with teardown observation
        if: ${{ !cancelled() }}
        env:
          WHITEPACT_REQUIRE_DOCKER_ISOLATION: "1"
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          plan = json.loads(Path("scripts/engineering/m13_ironclad_reference_shard0.json").read_text())
          args = [sys.executable, "scripts/engineering/m13_ironclad_task_diagnostics.py", *plan["files"], "-o", "addopts=", "--timeout=120", "--timeout-method=signal", "-o", "faulthandler_timeout=90", "--cov=src/responsibleai", "--cov=src/biasbuster", "--cov=src/privacylabel", "--cov-branch", "--cov-report=json:/tmp/ironclad/reference-coverage.json", "--junitxml=/tmp/ironclad/reference-shard0.xml", "-vv", "-ra", "--tb=short"]
          with open("/tmp/ironclad/reference-shard0.log", "w") as log:
              result = subprocess.run(args, stdout=log, stderr=subprocess.STDOUT, timeout=1500, check=False)
          sys.exit(result.returncode)
          PY
      - name: Preserve exact-head diagnosis evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ironclad-targeted-${{ matrix.python }}-${{ github.sha }}
          path: /tmp/ironclad/
