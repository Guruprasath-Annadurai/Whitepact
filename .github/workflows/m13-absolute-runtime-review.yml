name: M13 Absolute Runtime Review

on:
  pull_request:
    paths:
      - 'src/responsibleai/isolation/**'
      - 'scripts/engineering/reproducers/test_m13_absolute_runtime.py'
      - 'scripts/engineering/reproducers/test_m13_dual_titan_cancellation.py'
      - 'tests/test_m13_absolute_native_runtime.py'
      - 'scripts/engineering/reproducers/test_m13_convergence_tracking.py'
      - 'tests/test_m13_runtime_schema_compatibility.py'
      - 'tests/test_m13_apex_database_role_retirement.py'
      - 'src/responsibleai/db/runtime_compatibility.py'
      - 'tests/independent_m13r2/test_m13r_migration_roundtrip.py'
      - '.github/workflows/m13-absolute-runtime-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: wp
          POSTGRES_PASSWORD: wp
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U wp" --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install -r tests/requirements-m11.txt
          python -m pip install '.[dashboard,postgres,mcp]' alembic ruff==0.17.0
      - name: Record source and immutable original evidence
        run: |
          git rev-parse HEAD 'HEAD^{tree}' 'HEAD^'
          test "$(git rev-parse HEAD:tests/independent_m13r2/test_m13r_migration_roundtrip.py)" = f4d5731e9b2792b18a69e1fcfd475164ee4f0898
          test "$(git rev-parse HEAD:scripts/engineering/reproducers/test_m13_dual_titan_cancellation.py)" = bc00c78e9cafa461b58cde388610b43c5866acfe
      - name: Additional persistence and PostgreSQL startup counterexamples
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest scripts/engineering/reproducers/test_m13_convergence_tracking.py tests/test_m13_convergence_tracking.py tests/test_m13_runtime_schema_compatibility.py tests/test_m13_apex_database_role_retirement.py -o addopts='' --tb=short -ra
      - name: Unchanged counterexamples and neighboring runtime contracts
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest scripts/engineering/reproducers/test_m13_absolute_runtime.py scripts/engineering/reproducers/test_m13_dual_titan_cancellation.py scripts/engineering/reproducers/test_m13_corrective_authority.py::test_cleanup_error_does_not_erase_requested_cancellation scripts/engineering/reproducers/test_m13_apex_titan_acceptance.py::test_inspect_plugin_failure_does_not_prove_container_absence scripts/engineering/reproducers/test_m13_apex_titan_acceptance.py::test_directory_permission_failure_is_not_an_empty_registry tests/test_container_cleanup_race_adversarial.py tests/test_inflight_liveness_adversarial.py tests/test_in_flight_revocation.py tests/test_runtime_resilience_adversarial.py tests/test_revocation_kernel.py tests/test_delegation_revocation_verification.py -o addopts='' --junitxml=/tmp/runtime.xml --tb=short -ra
          python -c 'import xml.etree.ElementTree as E; r=E.parse("/tmp/runtime.xml"); assert not list(r.iter("skipped")) and not list(r.iter("failure")) and not list(r.iter("error"))'
      - run: |
          ruff check src/responsibleai/isolation/container_backend.py src/responsibleai/isolation/in_flight.py scripts/engineering/reproducers/test_m13_absolute_runtime.py tests/test_m13_absolute_native_runtime.py tests/test_m13_apex_database_role_retirement.py
          python scripts/check_pinned_actions.py
          python scripts/manage_license_headers.py --check
          python scripts/check_trust_regressions.py

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare disposable native Docker runner
        run: |
          sudo apt-get update
          sudo apt-get install -y acl
          docker info
          python -m pip install -r tests/requirements-m11.txt
          python -m pip install '.[dashboard,postgres,mcp]' alembic
          docker build -f Dockerfile.isolation -t whitepact-isolated-runtime:absolute .
      - name: Actual Docker execution, cancellation and failure containment
        env:
          PYTHONPATH: src:.
          WHITEPACT_REQUIRE_DOCKER_ISOLATION: '1'
          WHITEPACT_ISOLATION_IMAGE: whitepact-isolated-runtime:absolute
        run: |
          python -m pytest tests/test_m13_absolute_native_runtime.py tests/test_docker_ownership_regression.py tests/test_runtime_isolation_docker.py tests/test_container_isolation_contract.py -o addopts='' --junitxml=/tmp/native.xml --tb=short -ra
          python -c 'import xml.etree.ElementTree as E; r=E.parse("/tmp/native.xml"); assert not list(r.iter("skipped")) and not list(r.iter("failure")) and not list(r.iter("error"))'
