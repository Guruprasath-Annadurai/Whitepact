name: OpenSSF SPDX Bootstrap

on:
  push:
    branches: ["security/openssf-hardening"]

permissions:
  contents: write

jobs:
  apply-source-headers:
    if: "${{ !contains(github.event.head_commit.message, 'chore: apply source license headers') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security/openssf-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Apply source-file copyright and SPDX headers
        run: python scripts/manage_license_headers.py --write

      - name: Verify generated diff
        run: |
          python scripts/manage_license_headers.py --check
          git diff --check

      - name: Commit generated source headers
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source headers needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts examples
          git commit -s -m "chore: apply source license headers"
          git push origin HEAD:security/openssf-hardening
