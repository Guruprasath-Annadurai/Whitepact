name: M13 Absolute Bounded Full Python Matrix

on:
  push:
    branches: [codex/whitepact-m13-absolute-convergence]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint · Type-check · Test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ["3.11", "3.12"]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    timeout-minutes: 35
    env:
      PYTHONPATH: src:sdk/python:.
      PLAYWRIGHT_BROWSERS_PATH: /tmp/whitepact-m13-full-chromium
      WHITEPACT_REDIS_URL: redis://127.0.0.1:6379/0
      WHITEPACT_REQUIRE_REDIS: "1"
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: wp
          POSTGRES_PASSWORD: wp
          POSTGRES_DB: whitepact_e2e
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U wp -d whitepact_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Record tested source
        run: git rev-parse HEAD 'HEAD^{tree}' 'HEAD^'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev,openai,anthropic,sso,sentiment,postgres,redis]"
          pip install -r tests/requirements-wave1-frameworks.txt

      - name: Lint with ruff
        if: ${{ !cancelled() }}
        run: ruff check src/ tests/ sdk/python/

      - name: Check formatting with ruff
        if: ${{ !cancelled() }}
        run: ruff format --check src/ tests/ sdk/python/

      - name: Type-check with mypy
        if: ${{ !cancelled() }}
        run: mypy src/responsibleai

      - name: Scan dependencies for known vulnerabilities
        if: ${{ !cancelled() }}
        run: |
          pip install --require-hashes -r requirements-security.lock
          # PYSEC-2026-597: nltk path traversal in nltk.data.load()/find() via
          # percent-encoded "../" sequences. PYSEC-2026-3740: path traversal
          # in model-artifact import/export APIs. Neither has a fixed release.
          # nltk is an opt-in extra ([sentiment]), not installed by a
          # plain `pip install rai-governance-platform` — this CI run
          # installs it explicitly to keep VADER sentiment tests real.
          # Triaged as not exploitable even when installed: this codebase's
          # only nltk call is nltk.download("vader_lexicon", quiet=True), a
          # hardcoded literal resource name. It does not call nltk.data.load,
          # TransitionParser, AveragedPerceptron, PerceptronTagger, or maxent
          # parameter APIs. Re-check when nltk ships a patched release.
          # --skip-editable: this project itself is installed via `pip install -e .`
          # (see "Install dependencies" above) and isn't published to PyPI under
          # this exact version yet, which otherwise makes pip-audit hard-fail
          # trying to look up the local editable install as if it were a
          # third-party dependency, rather than actually finding no vulnerability.
          # No --strict here: verified locally that this pip-audit version treats
          # --skip-editable's skip notices as fatal errors under --strict, which
          # defeats the point of skipping; the default (non-strict) mode already
          # fails on a real vulnerability finding, which is what this step is for.
          pip-audit --skip-editable \
            --ignore-vuln PYSEC-2026-597 \
            --ignore-vuln PYSEC-2026-3740

      - name: Install mandatory Linux security-test tools
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 nginx acl

      - name: Security-fix inclusion gate
        if: ${{ !cancelled() }}
        run: python scripts/check_security_fix_inclusion.py

      - name: Security regression behavior gate
        if: ${{ !cancelled() }}
        run: python scripts/check_security_regressions.py

      - name: Build the isolated tool runtime image
        if: ${{ !cancelled() }}
        # Real-tool isolation tests need an image that contains WhitePact. The stock
        # python image cannot run the trusted runner. Used only by
        # tests/test_isolation_real_tool_e2e.py (WHITEPACT_TEST_RUNTIME_IMAGE).
        run: |
          docker build -f Dockerfile.isolation -t whitepact-isolated-runtime:ci .
          echo "WHITEPACT_TEST_RUNTIME_IMAGE=whitepact-isolated-runtime:ci" >> "$GITHUB_ENV"

      - name: Build TypeScript SDK
        if: ${{ !cancelled() }}
        run: |
          npm --prefix sdk/typescript ci --ignore-scripts --no-audit --no-fund
          npm --prefix sdk/typescript run build

      - name: Run accounted bounded test shard
        if: ${{ !cancelled() }}
        env:
          WHITEPACT_REQUIRE_DOCKER_ISOLATION: "1"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m pip install 'pytest-timeout>=2.3,<3'
          python scripts/engineering/m13_full_suite.py --shard ${{ matrix.shard }} --output /tmp/full-suite

      - name: Preserve full-suite evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-suite-${{ matrix.python-version }}-${{ matrix.shard }}-${{ github.sha }}
          include-hidden-files: true
          path: /tmp/full-suite/

  coverage:
    if: always()
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: full-suite-${{ matrix.python-version }}-*-${{ github.sha }}
          path: /tmp/shards
      - name: Account every test and enforce original aggregate thresholds
        run: python scripts/engineering/m13_combine_suite.py /tmp/shards
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-suite-aggregate-${{ matrix.python-version }}-${{ github.sha }}
          path: |
            full-suite-summary.json
            coverage.json
            coverage.xml
