name: M12 Product Engineering Review
on:
  push:
    branches: [codex/whitepact-m12-product-integration]
  pull_request:
    paths:
      - 'sdk/**'
      - 'docs/m12/**'
      - 'scripts/evidence/inspect_loaded_export.py'
      - 'scripts/qualification/feature_registry.py'
      - 'scripts/evaluation/local_authorization_benchmark.py'
      - 'tests/test_m12_*'
      - 'tests/test_sdk_resource_identifiers.py'
      - '.github/workflows/m12-product-review.yml'
permissions:
  contents: read
jobs:
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Existing real compiled console, not customer authority provisioning
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
          npm --prefix web run lint
          npm --prefix web test -- --run
          npm --prefix web run build
          git diff --exit-code -- src/responsibleai/dashboard/static/whitepact
          npx playwright install --with-deps chromium
          node tests/js/enterprise-console-safety.e2e.mjs
          node tests/js/m11-enterprise-product.e2e.mjs
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: wp
          POSTGRES_PASSWORD: wp
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U wp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: |
          python -m pip install -r tests/requirements-m11.txt
          python -m pip install '.[dashboard,postgres,mcp]' alembic
          npm --prefix sdk/typescript ci --ignore-scripts --no-audit --no-fund
          npm --prefix sdk/typescript run build
      - name: Strict feature provenance and actual consumer/domain contracts
        env:
          PYTHONPATH: src:.
        run: |
          ruff check scripts/evidence/inspect_loaded_export.py scripts/evaluation/local_authorization_benchmark.py scripts/qualification/feature_registry.py tests/test_m12_*.py tests/test_sdk_resource_identifiers.py sdk/python/rai_client/governance.py
          ruff format --check scripts/evidence/inspect_loaded_export.py scripts/evaluation/local_authorization_benchmark.py scripts/qualification/feature_registry.py tests/test_m12_*.py tests/test_sdk_resource_identifiers.py sdk/python/rai_client/governance.py
          python scripts/qualification/feature_registry.py docs/m12/feature-registry.json --check-generated
          python -m alembic heads
          git diff --check
          python -m pytest tests/formula tests/test_m11_*.py tests/test_m12_*.py tests/test_evaluation_benchmark_safety.py tests/test_server_json.py tests/test_sdk*.py tests/test_customer_real_approval_journey.py tests/test_developer_sdk_live_api.py tests/test_go_governance_live_api.py -q --no-cov
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - working-directory: sdk/typescript
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

# Deliberately no deployment/OIDC/live credentials. G1 metadata validation is not
# independent qualification. Local customer API tests disclose development IDV,
# seeded authority and fixture flags; they do not satisfy fresh customer G2/G4.
# Go race/vet/build are also triggered by the existing pinned Go SDK workflow.
