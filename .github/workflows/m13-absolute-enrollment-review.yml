name: M13 Absolute First Enrollment Review

on:
  pull_request:
    paths:
      - 'src/responsibleai/enterprise/security/service.py'
      - 'scripts/engineering/reproducers/test_m13_absolute_first_passkey.py'
      - 'docs/security/m13-absolute/**'
      - '.github/workflows/m13-absolute-enrollment-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: wp
          POSTGRES_PASSWORD: wp
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U wp" --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a5a2fbfcfd17edb3459830ed0eff84003dfec42e
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable M13 qualification target
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          test "$(git rev-parse HEAD)" = a5a2fbfcfd17edb3459830ed0eff84003dfec42e
          test "$(git rev-parse 'HEAD^{tree}')" = 58756fd88cacf26163cd312c844959c62370edc7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install supported qualification dependencies
        run: |
          python -m pip install -r tests/requirements-m11.txt
          python -m pip install '.[dashboard,postgres,mcp,sso]' alembic ruff==0.17.0
      - name: Verify approved formatting evidence relationships
        run: python scripts/engineering/m13_approved_formatting.py
      - name: Record exact source and immutable original evidence
        run: |
          git rev-parse HEAD 'HEAD^{tree}' 'HEAD^'
          python scripts/engineering/m13p4_security_acceptance.py --repo "$PWD" --candidate "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD:scripts/engineering/reproducers/test_m13_apex_titan_acceptance.py)" = 7e3500ca714701553e69afb2de12174a72d08a22
      - name: Independent persistence and unchanged identity/root neighbors
        env:
          PYTHONPATH: src:.
          WHITEPACT_QUALIFICATION_SKIP_LOG: /tmp/m13-absolute-enrollment-skips.json
        run: |
          python -m pytest scripts/engineering/reproducers/test_m13_absolute_first_passkey.py tests/test_enterprise_layer2_identity_security.py tests/test_enterprise_security_branch_campaign.py tests/test_enterprise_security_branch_campaign_batch2.py tests/test_m13_titan_root_adversarial.py tests/test_m13_titan_authority_closure.py tests/test_m13_root_real_concurrency.py tests/test_m13_convergence_fixture_integrity.py -o addopts='' --tb=short -ra
          python -c 'import json; r=json.load(open("/tmp/m13-absolute-enrollment-skips.json")); assert r["exit_status"] == 0 and r["skip_count"] == 0, r'
      - name: Source lint and unchanged supply-chain policies
        run: |
          ruff check src/responsibleai/enterprise/security/service.py scripts/engineering/reproducers/test_m13_absolute_first_passkey.py
          python scripts/check_pinned_actions.py
          python scripts/manage_license_headers.py --check
          python scripts/check_trust_regressions.py
