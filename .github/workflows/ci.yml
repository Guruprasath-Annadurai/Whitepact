name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev,openai,anthropic,sso,sentiment]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type-check with mypy
        run: mypy src/responsibleai

      - name: Scan dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          # PYSEC-2026-597: nltk path traversal in nltk.data.load()/find() via
          # percent-encoded "../" sequences. No fix version exists upstream
          # yet. nltk is an opt-in extra ([sentiment]), not installed by a
          # plain `pip install rai-governance-platform` — this CI run
          # installs it explicitly to keep VADER sentiment tests real.
          # Triaged as not exploitable even when installed: this codebase's
          # only nltk call is nltk.download("vader_lexicon", quiet=True), a
          # hardcoded literal resource name; the attack requires
          # attacker-controlled input to that parameter, which never happens
          # in this code path. Re-check when nltk ships a patched release.
          # --skip-editable: this project itself is installed via `pip install -e .`
          # (see "Install dependencies" above) and isn't published to PyPI under
          # this exact version yet, which otherwise makes pip-audit hard-fail
          # trying to look up the local editable install as if it were a
          # third-party dependency, rather than actually finding no vulnerability.
          # No --strict here: verified locally that this pip-audit version treats
          # --skip-editable's skip notices as fatal errors under --strict, which
          # defeats the point of skipping; the default (non-strict) mode already
          # fails on a real vulnerability finding, which is what this step is for.
          pip-audit --skip-editable --ignore-vuln PYSEC-2026-597

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src/responsibleai \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-fail-under=80 \
            -q

      - name: Enforce branch coverage (OpenSSF dynamic_analysis)
        run: |
          # --cov-fail-under=80 above gates on the BLENDED statement+branch
          # percentage coverage.py's own terminal report prints -- not the
          # same metric as OpenSSF's dynamic_analysis criterion, which asks
          # for pure branch coverage (covered_branches / num_branches),
          # isolated from statement coverage. Real pure branch coverage
          # reached 80.19% via genuine new tests (see
          # compliance/OPENSSF_DYNAMIC_ANALYSIS.md) -- this is now a real,
          # hard-failing gate rather than informational-only.
          python scripts/check_branch_coverage.py --threshold 80 --fail

      - name: Check documentation consistency (OpenSSF Silver documentation_current)
        run: python scripts/check_doc_consistency.py

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distribution
        run: twine check dist/*

      # Phase 15 (supply chain security) -- generated on every build, not
      # just at release, so a PR reviewer can see the dependency closure
      # a change would ship before it's tagged. The release workflow
      # (publish.yml) regenerates and attaches its own copy at tag time.
      - name: Generate SBOM (CycloneDX)
        run: |
          python -m venv /tmp/sbom-venv
          /tmp/sbom-venv/bin/pip install --upgrade pip
          /tmp/sbom-venv/bin/pip install dist/*.whl
          /tmp/sbom-venv/bin/pip install cyclonedx-bom
          /tmp/sbom-venv/bin/cyclonedx-py environment \
            --pyproject pyproject.toml \
            --of json \
            -o sbom.cyclonedx.json \
            /tmp/sbom-venv/bin/python

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            sbom.cyclonedx.json

  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Lint Helm chart
        run: helm lint helm/rai-governance/

      - name: Validate Helm template rendering
        run: |
          helm template rai-governance helm/rai-governance/ \
            --set image.tag=ci-test \
            --debug \
            > /dev/null
