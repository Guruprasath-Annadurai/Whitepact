name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Verify dependency lock and production export
        run: |
          pip install uv==0.11.22
          uv lock --check
          uv export --locked --no-header --no-emit-project \
            --extra dashboard --extra postgres --extra redis \
            --extra telemetry --extra sso --extra billing \
            --output-file /tmp/requirements-production.lock > /dev/null
          diff -u requirements-production.lock /tmp/requirements-production.lock

      - name: Install dependencies
        run: |
          # PYSEC-2026-3447: setup-python's bundled setuptools predates the
          # fix (83.0.0). Upgrade explicitly before installing this project
          # so pip-audit below scans a patched version, not the base image's.
          pip install --upgrade "setuptools>=83.0.0"
          pip install -e ".[dev,openai,anthropic,sso,sentiment]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Check formatting with ruff
        run: ruff format --check src/ tests/

      - name: Type-check with mypy
        run: mypy src/responsibleai

      - name: Scan dependencies for known vulnerabilities
        run: |
          pip install pip-audit==2.9.0
          # PYSEC-2026-597: nltk path traversal in nltk.data.load()/find() via
          # percent-encoded "../" sequences. No fix version exists upstream
          # yet. nltk is an opt-in extra ([sentiment]), not installed by a
          # plain `pip install rai-governance-platform` — this CI run
          # installs it explicitly to keep VADER sentiment tests real.
          # Triaged as not exploitable even when installed: this codebase's
          # only nltk call is nltk.download("vader_lexicon", quiet=True), a
          # hardcoded literal resource name; the attack requires
          # attacker-controlled input to that parameter, which never happens
          # in this code path. Re-check when nltk ships a patched release.
          # --skip-editable: this project itself is installed via `pip install -e .`
          # (see "Install dependencies" above) and isn't published to PyPI under
          # this exact version yet, which otherwise makes pip-audit hard-fail
          # trying to look up the local editable install as if it were a
          # third-party dependency, rather than actually finding no vulnerability.
          # No --strict here: verified locally that this pip-audit version treats
          # --skip-editable's skip notices as fatal errors under --strict, which
          # defeats the point of skipping; the default (non-strict) mode already
          # fails on a real vulnerability finding, which is what this step is for.
          pip-audit --skip-editable --ignore-vuln PYSEC-2026-597

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src/responsibleai \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-fail-under=80 \
            -q

      - name: Enforce branch coverage (OpenSSF dynamic_analysis)
        run: |
          # --cov-fail-under=80 above gates on the BLENDED statement+branch
          # percentage coverage.py's own terminal report prints -- not the
          # same metric as OpenSSF's dynamic_analysis criterion, which asks
          # for pure branch coverage (covered_branches / num_branches),
          # isolated from statement coverage. Real pure branch coverage
          # reached 80.19% via genuine new tests (see
          # compliance/OPENSSF_DYNAMIC_ANALYSIS.md) -- this is now a real,
          # hard-failing gate rather than informational-only.
          python scripts/check_branch_coverage.py --threshold 80 --fail

      - name: Check documentation consistency (OpenSSF Silver documentation_current)
        run: python scripts/check_doc_consistency.py

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build==1.5.0 twine==7.0.0 cyclonedx-bom==7.3.1

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distribution
        run: twine check dist/*

      # Phase 15 (supply chain security) -- generated on every build, not
      # just at release, so a PR reviewer can see the dependency closure
      # a change would ship before it's tagged. The release workflow
      # (publish.yml) regenerates and attaches its own copy at tag time.
      - name: Generate SBOM (CycloneDX)
        run: |
          python -m venv /tmp/sbom-venv
          /tmp/sbom-venv/bin/pip install --require-hashes -r requirements-production.lock
          /tmp/sbom-venv/bin/pip install --no-deps dist/*.whl
          cyclonedx-py environment \
            --pyproject pyproject.toml \
            --of json \
            -o sbom.cyclonedx.json \
            /tmp/sbom-venv/bin/python

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            dist/
            sbom.cyclonedx.json

  docker-build:
    name: Build production container
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build hash-locked production image
        run: docker build --tag whitepact:ci .

  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: "3.14.0"

      - name: Lint Helm chart
        run: helm lint helm/rai-governance/

      - name: Validate Helm template rendering
        run: |
          helm template rai-governance helm/rai-governance/ \
            --set image.tag=ci-test \
            --debug \
            > /dev/null
          helm template rai-governance helm/rai-governance/ \
            -f helm/rai-governance/values-production.yaml \
            --set-string config.mcpOauthResourceUri=https://mcp.example.com/mcp \
            --set-string oidc.issuer=https://idp.example.com \
            --set-string oidc.clientId=whitepact \
            --set-string oidc.existingSecret=whitepact-oidc \
            --debug \
            > /dev/null

  accessibility:
    name: Accessibility (WCAG2AA)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install project
        run: pip install -e ".[dashboard]"

      - name: Install pa11y-ci
        run: npm ci

      - name: Start dashboard (auth disabled, in-memory DB)
        run: |
          RAI_AUTH_ENABLED=false RAI_DB_PATH=:memory: \
            nohup uvicorn responsibleai.dashboard.app:app --host 127.0.0.1 --port 8765 \
            > dashboard.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8765/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/ > /dev/null || (cat dashboard.log && exit 1)

      - name: Run pa11y-ci against public/dashboard pages (docs/ACCESSIBILITY.md)
        run: npx pa11y-ci --config .pa11yci.json

  i18n-tests:
    name: i18n unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Run i18n unit tests (locale resolution, fallback, catalog integrity)
        run: node --test tests/js/i18n.test.js
