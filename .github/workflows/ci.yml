name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

# CI only needs to read repository contents. Individual jobs do not receive
# broader token capabilities unless explicitly added later.
permissions:
  contents: read

jobs:
  test:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Check formatting with ruff
        run: ruff format --check src/ tests/

      - name: Type-check with mypy
        run: mypy src/responsibleai

      - name: Scan dependencies for known vulnerabilities
        run: |
          # PYSEC-2026-597: nltk path traversal in nltk.data.load()/find() via
          # percent-encoded "../" sequences. No fix version exists upstream
          # yet. nltk is an opt-in extra ([sentiment]), not installed by a
          # plain `pip install rai-governance-platform` — this CI run
          # installs it explicitly to keep VADER sentiment tests real.
          # Triaged as not exploitable even when installed: this codebase's
          # only nltk call is nltk.download("vader_lexicon", quiet=True), a
          # hardcoded literal resource name; the attack requires
          # attacker-controlled input to that parameter, which never happens
          # in this code path. Re-check when nltk ships a patched release.
          pip-audit --ignore-vuln PYSEC-2026-597 -r requirements-ci.lock

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src/responsibleai \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-fail-under=80 \
            -q

      - name: Enforce branch coverage (OpenSSF dynamic_analysis)
        run: |
          # --cov-fail-under=80 above gates on the BLENDED statement+branch
          # percentage coverage.py's own terminal report prints -- not the
          # same metric as OpenSSF's dynamic_analysis criterion, which asks
          # for pure branch coverage (covered_branches / num_branches),
          # isolated from statement coverage. Real pure branch coverage
          # reached 80.19% via genuine new tests (see
          # compliance/OPENSSF_DYNAMIC_ANALYSIS.md) -- this is now a real,
          # hard-failing gate rather than informational-only.
          python scripts/check_branch_coverage.py --threshold 80 --fail

      - name: Enforce statement coverage (OpenSSF Gold)
        run: |
          # Gold requires pure statement coverage >=90%. The coverage.py
          # terminal "Cover" value is blended when branch measurement is on,
          # so use an explicit statement-only calculation from coverage.json.
          python scripts/check_statement_coverage.py --threshold 90 --fail

      - name: Check documentation consistency (OpenSSF Silver documentation_current)
        run: python scripts/check_doc_consistency.py

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: coverage.xml
          fail_ci_if_error: false

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --require-hashes -r requirements-build.lock

      - name: Build wheel and sdist
        run: python -m build --no-isolation

      - name: Verify distribution
        run: twine check dist/*

      # Phase 15 (supply chain security) -- generated on every build, not
      # just at release, so a PR reviewer can see the dependency closure
      # a change would ship before it's tagged. The release workflow
      # (publish.yml) regenerates and attaches its own copy at tag time.
      - name: Generate SBOM (CycloneDX)
        run: |
          python -m venv /tmp/sbom-venv
          /tmp/sbom-venv/bin/python -m pip install --require-hashes -r requirements-container.lock
          /tmp/sbom-venv/bin/python -m installer dist/*.whl
          cyclonedx-py environment \
            --pyproject pyproject.toml \
            --of json \
            -o sbom.cyclonedx.json \
            /tmp/sbom-venv/bin/python

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            dist/
            sbom.cyclonedx.json

  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: "3.14.0"

      - name: Lint Helm chart
        run: helm lint helm/rai-governance/

      - name: Validate Helm template rendering
        run: |
          helm template rai-governance helm/rai-governance/ \
            --set image.tag=ci-test \
            --debug \
            > /dev/null

  accessibility:
    name: Accessibility (WCAG2AA)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install project
        run: python -m pip install --require-hashes -r requirements-container.lock

      - name: Install accessibility tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start dashboard (auth disabled, in-memory DB)
        run: |
          RAI_AUTH_ENABLED=false RAI_DB_PATH=:memory: \
            nohup uvicorn responsibleai.dashboard.app:app --host 127.0.0.1 --port 8765 \
            > dashboard.log 2>&1 &
          for i in $(seq 1 20); do
            echo "dashboard readiness attempt ${i}/20"
            curl -sf http://127.0.0.1:8765/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/ > /dev/null || (cat dashboard.log && exit 1)

      - name: Run accessibility gate against public/dashboard pages
        run: npm run a11y

  i18n-tests:
    name: i18n unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Run i18n unit tests (locale resolution, fallback, catalog integrity)
        run: node --test tests/js/i18n.test.js
