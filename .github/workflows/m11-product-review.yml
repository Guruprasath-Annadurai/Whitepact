name: M11 Product Engineering Review
on:
  push:
    branches: [codex/whitepact-m11-product-integration]
  pull_request:
    paths:
      - 'web/**'
      - 'tests/test_m11_*'
      - 'tests/js/m11-enterprise-product.e2e.mjs'
      - 'scripts/infra/validate_terraform.py'
      - 'server.json'
      - '.github/workflows/m11-product-review.yml'
permissions:
  contents: read
jobs:
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
          npm --prefix web run lint
          npm --prefix web test -- --run
          npm --prefix web run build
          git diff --exit-code -- src/responsibleai/dashboard/static/whitepact
          npx playwright install --with-deps chromium
          node tests/js/enterprise-console-safety.e2e.mjs
          node tests/js/m11-enterprise-product.e2e.mjs
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: wp
          POSTGRES_PASSWORD: wp
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U wp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: |
          python -m pip install -r tests/requirements-m11.txt
          python -m pip install '.[dashboard,postgres,mcp]' alembic
          npm --prefix sdk/typescript ci --ignore-scripts --no-audit --no-fund
          npm --prefix sdk/typescript run build
      - name: Static checks and actual domain/customer contracts
        env:
          PYTHONPATH: src:.
        run: |
          ruff check tests/test_m11_*.py scripts/infra/validate_terraform.py
          ruff format --check tests/test_m11_*.py scripts/infra/validate_terraform.py
          git diff --check
          python -m pytest tests/formula tests/test_m11_*.py tests/test_server_json.py tests/test_sdk*.py tests/test_customer_real_approval_journey.py tests/test_developer_sdk_live_api.py tests/test_go_governance_live_api.py -q --no-cov
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Independently checksum-pinned native Terraform, no wrapper
        env:
          M11_NATIVE_DIR: ${{ runner.temp }}/whitepact-m11-terraform
        run: |
          mkdir -p "$M11_NATIVE_DIR"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip -o "$M11_NATIVE_DIR/terraform.zip"
          echo '186e0145f5e5f2eb97cbd785bc78f21bae4ef15119349f6ad4fa535b83b10df8  terraform.zip' | (cd "$M11_NATIVE_DIR" && sha256sum --check -)
          unzip -q "$M11_NATIVE_DIR/terraform.zip" -d "$M11_NATIVE_DIR"
          python scripts/infra/validate_terraform.py --terraform-binary "$M11_NATIVE_DIR/terraform" --revision HEAD --allow-provider-download

# No deployment token, OIDC permission, live account or secret. Real PostgreSQL
# journeys disclose development IDV and seeded authority; no customer bootstrap
# or Formula domain test is promoted to production enforcement qualification.
