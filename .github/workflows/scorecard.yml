name: OpenSSF Scorecard

# Free, automated, third-party-run security posture scan — not a
# substitute for a paid SOC 2 audit, but a real, independently
# reproducible signal an enterprise security reviewer can check
# themselves rather than trust on our word. See
# compliance/SOC2_ALTERNATIVE_PATH.md for why this exists and what it
# does and doesn't prove. Official upstream action, zero cost:
# https://github.com/ossf/scorecard-action

on:
  branch_protection_rule:
  schedule:
    - cron: "24 3 * * 2" # weekly, per upstream's recommended cadence
  push:
    branches: ["main"]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read         # checkout only
      security-events: write # upload SARIF to code scanning
      id-token: write        # publish results to the public Scorecard API

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: results.sarif
