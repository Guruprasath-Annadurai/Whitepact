name: OpenSSF Scorecard

# Free, automated, third-party-run security posture scan — not a
# substitute for a paid SOC 2 audit, but a real, independently
# reproducible signal an enterprise security reviewer can check
# themselves rather than trust on our word. See
# compliance/SOC2_ALTERNATIVE_PATH.md for why this exists and what it
# does and doesn't prove. Official upstream action, zero cost:
# https://github.com/ossf/scorecard-action

on:
  branch_protection_rule:
  schedule:
    - cron: "24 3 * * 2" # weekly, per upstream's recommended cadence
  push:
    branches: ["main"]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write        # publish results to the public Scorecard API

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
