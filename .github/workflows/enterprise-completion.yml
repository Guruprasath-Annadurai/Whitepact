name: Enterprise Completion Review

on:
  push:
    branches: [codex/whitepact-enterprise-product-completion]
  pull_request:
    paths:
      - 'web/**'
      - 'tests/js/enterprise-console-safety.e2e.mjs'
      - 'tests/test_crewai_llamaindex_governance_consumers.py'
      - 'tests/test_evaluation_benchmark_safety.py'
      - '.github/workflows/enterprise-completion.yml'

permissions:
  contents: read

jobs:
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Locked frontend dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - name: Frontend lint, unit contracts and production build
        run: |
          npm --prefix web run lint
          npm --prefix web test -- --run
          npm --prefix web run build
      - name: Rendered uncertainty and onboarding accessibility contracts
        run: |
          npx playwright install --with-deps chromium
          node tests/js/enterprise-console-safety.e2e.mjs
      - name: Source whitespace
        run: git diff --check

  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Genuine framework dependencies
        run: python -m pip install -r tests/requirements-crewai-llamaindex-consumers.txt
      - name: Genuine consumers, not Core authorization qualification
        env:
          PYTHONPATH: src:sdk/python
          OTEL_SDK_DISABLED: 'true'
          CREWAI_TRACING_ENABLED: 'false'
        run: >-
          python -m pytest tests/test_crewai_llamaindex_governance_consumers.py
          -q -o addopts='' --noconftest

# Controlled API fixtures prove consumer/UX behavior only. Existing SDK, package,
# protocol, full-platform and independent release gates remain mandatory.
