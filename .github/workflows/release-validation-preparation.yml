# PREPARATION — manual release-validation rehearsal. Not a merge gate yet.
name: Release validation preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-backend-prep:
    name: Disposable Postgres + focused backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wp
          POSTGRES_PASSWORD: wp
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U wp -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with supported extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dashboard,postgres,sso,sentiment,mcp]"
      - name: Alembic single head
        run: alembic heads
      - name: Focused postgres + MCP registry tests
        env:
          WHITEPACT_TEST_PG_ADMIN_URL: postgresql://wp:wp@127.0.0.1:55432/postgres
        run: |
          pytest tests/test_postgres_migrations.py tests/test_db_migrate.py \
            tests/test_auth_real_postgres.py tests/test_mcp_production_tool_registry.py -q
