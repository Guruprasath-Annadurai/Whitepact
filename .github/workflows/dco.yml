name: DCO

# Enforces CONTRIBUTING.md's Developer Certificate of Origin requirement:
# every non-merge commit in a PR must carry a real "Signed-off-by:" trailer
# (from `git commit -s`). Two exact historical SHAs are owner-approved
# exceptions recorded in compliance/DCO_HISTORICAL_EXCEPTION_2026-10-09.md.
# An exception is not a sign-off. There is no date, author, or bot exemption.
# Implemented as a plain shell check rather than a third-party GitHub
# App/Action so it needs no external installation and stays fully
# inspectable in this repo.

on:
  pull_request:
    branches: [main, cursor/whitepact-rc-remediation-b6a9]

permissions:
  contents: read

jobs:
  dco-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full PR history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check every commit is signed off
        env:
          DCO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          base="${DCO_BASE_SHA}"
          head="${DCO_HEAD_SHA}"

          # Non-merge commits introduced by this PR.
          commits=$(git rev-list --no-merges "${base}..${head}")

          if [ -z "$commits" ]; then
            echo "No commits to check."
            exit 0
          fi

          missing=0
          for sha in $commits; do
            # Owner-approved historical exceptions. Exact SHAs only. Not a sign-off.
            case "$sha" in
              015fab741427a5a9cae5bca7adaa9729c78da9e5|681ce9566f0ef9b68b6fc97212cc2fb7a44135e3)
                echo "Owner-approved historical DCO exception for ${sha}."
                echo "This exception is not a Signed-off-by trailer."
                echo "Record: compliance/DCO_HISTORICAL_EXCEPTION_2026-10-09.md"
                continue
                ;;
              c176669597c4812f0ab1ead88e4274128d9939c1|85a992aab4a1970a0cc25dabc09ef032f0612d15|55ab0ca7c01ef1da0f106cd76b21874203b5039e|5dcf04238a06813a8782cc8d46e6638396e19aef)
                echo "Owner-approved historical DCO exception for ${sha}."
                echo "This exception is not a Signed-off-by trailer."
                echo "Record: compliance/DCO_HISTORICAL_EXCEPTION_2026-10-11.md"
                continue
                ;;
            esac
            msg=$(git log -1 --format=%B "$sha")
            if ! echo "$msg" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $sha is missing a 'Signed-off-by:' trailer."
              echo "  Subject: $(git log -1 --format=%s "$sha")"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "One or more commits are not signed off. Fix with:"
            echo "  git commit --amend -s          # most recent commit"
            echo "  git rebase --exec 'git commit --amend --no-edit -s' -i ${base}"
            echo "See CONTRIBUTING.md's DCO section for details."
            echo "Do not amend 015fab741427a5a9cae5bca7adaa9729c78da9e5 or 681ce9566f0ef9b68b6fc97212cc2fb7a44135e3."
            exit 1
          fi

          echo "DCO check passed."
