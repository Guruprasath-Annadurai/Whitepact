name: DCO

# Enforces CONTRIBUTING.md's Developer Certificate of Origin requirement:
# every commit in a PR must carry a real "Signed-off-by:" trailer (from
# `git commit -s`). Implemented as a plain shell check rather than a
# third-party GitHub App/Action so it needs no external installation and
# stays fully inspectable in this repo.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with full PR history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check every commit is signed off
        run: |
          set -euo pipefail

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          # Non-merge commits introduced by this PR.
          commits=$(git rev-list --no-merges "${base}..${head}")

          if [ -z "$commits" ]; then
            echo "No commits to check."
            exit 0
          fi

          missing=0
          for sha in $commits; do
            msg=$(git log -1 --format=%B "$sha")
            if ! echo "$msg" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $sha is missing a 'Signed-off-by:' trailer."
              echo "  Subject: $(git log -1 --format=%s "$sha")"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "One or more commits are not signed off. Fix with:"
            echo "  git commit --amend -s          # most recent commit"
            echo "  git rebase --exec 'git commit --amend --no-edit -s' -i ${base}"
            echo "See CONTRIBUTING.md's DCO section for details."
            exit 1
          fi

          echo "All commits are signed off."
