name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # OpenSSF Best Practices `version_tags_signed` -- a signed build
  # pipeline that runs on any pushed tag proves the *pipeline* is
  # trustworthy once triggered, not that a trusted human actually
  # intended to cut this release. This job is that second, separate
  # check: it verifies the triggering Git tag is annotated, carries a
  # valid SSH signature, and was signed by a key listed in
  # security/release-signers.allowed -- before anything gets built or
  # published. See compliance/SIGNED_VERSION_TAGS.md for why this is a
  # distinct control from the build-provenance attestation below, and
  # RELEASING.md for the founder-facing signing setup.
  verify-signed-tag:
    name: Verify signed release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # need the full tag object, not a shallow/blobless clone

      - name: Reject lightweight tags, verify SSH signature against approved signers
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "Verifying tag: $TAG"

          # actions/checkout resolves a tag-push trigger to its
          # dereferenced commit SHA (GITHUB_SHA), not the annotated tag
          # object itself -- the local ref it creates for $TAG can end
          # up pointing straight at that commit, indistinguishable from
          # a lightweight tag to `git cat-file -t`, even though the
          # pushed ref on origin genuinely is an annotated, signed tag
          # object. Force-fetch the real tag object explicitly before
          # inspecting it, rather than trusting whatever local ref
          # checkout happened to set up.
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force

          # 1. Lightweight tags point directly at a commit object and
          # carry no signature at all -- reject before even attempting
          # verification, since `git tag -v` on a lightweight tag can
          # be misleadingly silent rather than a clear failure.
          TYPE="$(git cat-file -t "$TAG")"
          if [ "$TYPE" != "tag" ]; then
            echo "::error::Tag '$TAG' is a lightweight tag (git cat-file -t reports '$TYPE', expected 'tag'). Release tags must be annotated and signed: git tag -s $TAG -m '...'"
            exit 1
          fi

          # 2. SSH-format signature verification against a
          # repository-controlled, PR-reviewed allow-list of approved
          # signers' PUBLIC keys -- never a private key, never a
          # secret, safe to read straight from the checked-out tree.
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "${GITHUB_WORKSPACE}/security/release-signers.allowed"

          # 3. An allowed-signers file with no real key in it must fail
          # closed, not silently pass every tag as "no policy
          # violation found" -- "nobody is approved yet" is itself a
          # failure state for a release gate.
          if ! grep -qE '^[^#[:space:]]+[[:space:]]+ssh-' security/release-signers.allowed; then
            echo "::error::No approved release signer is configured in security/release-signers.allowed yet. See compliance/SIGNED_VERSION_TAGS.md Section 5 -- founder action required before any tag can pass this gate."
            exit 1
          fi

          # 4. The actual verification -- fails on a missing signature,
          # an invalid signature, or a signature from a key not present
          # in the allowed-signers file.
          if ! git tag -v "$TAG"; then
            echo "::error::Tag '$TAG' failed signature verification -- missing signature, invalid signature, or signed by a key not listed in security/release-signers.allowed."
            exit 1
          fi

          echo "Tag '$TAG' is annotated, signed, and verified against an approved release signer."

  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    needs: verify-signed-tag
    environment: pypi
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools
        run: pip install build==1.5.0 twine==7.0.0 cyclonedx-bom==7.3.1

      - name: Verify tag matches package version
        run: python scripts/check_release_version.py "${GITHUB_REF_NAME}"

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distribution
        run: twine check dist/*

      # Phase 15 (supply chain security) -- generate a CycloneDX SBOM
      # from the actual shipped artifact's dependency closure, not just
      # a static read of pyproject.toml, by installing the built wheel
      # into a clean venv first and scanning *that* environment.
      - name: Generate SBOM (CycloneDX)
        run: |
          python -m venv /tmp/sbom-venv
          /tmp/sbom-venv/bin/pip install --require-hashes -r requirements-production.lock
          /tmp/sbom-venv/bin/pip install --no-deps dist/*.whl
          cyclonedx-py environment \
            --pyproject pyproject.toml \
            --of json \
            -o sbom.cyclonedx.json \
            /tmp/sbom-venv/bin/python

      # Sigstore-backed, GitHub-attested provenance for the built wheel +
      # sdist -- a consumer can verify these artifacts were built by this
      # repo's own workflow from this exact commit, not tampered with or
      # substituted in between. Verify with:
      #   gh attestation verify dist/<file> --owner Guruprasath-Annadurai
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      # Phase 16 (release engineering) -- a GitHub Release previously
      # never got created by this workflow; the tag existed, PyPI got
      # the package, but there was no single place linking a version to
      # its changelog entry, its SBOM, and its build provenance.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*
            sbom.cyclonedx.json
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the curated entry for this version.

            **Supply chain verification** (Phase 15):
            - SBOM: `sbom.cyclonedx.json` (CycloneDX 1.6) attached to this release.
            - Build provenance: `gh attestation verify <file> --owner ${{ github.repository_owner }}`
