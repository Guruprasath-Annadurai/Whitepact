name: Wave 1 Protocol and Framework Qualification

on:
  push:
    branches: [codex/whitepact-wave1-compatibility-qualification]
  pull_request:
    paths:
      - 'tests/test_mcp_wave1_compatibility.py'
      - 'tests/test_wave1_framework_compatibility.py'
      - 'tests/requirements-wave1-frameworks.txt'
      - 'docs/engineering/WAVE1_*'
      - '.github/workflows/wave1-compatibility.yml'

permissions:
  contents: read

jobs:
  protocol:
    name: Real MCP transport Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Isolated protocol dependencies
        run: |
          python -m pip install -r sdk/python/requirements-test.txt
          python -m pip install '.[dashboard,mcp,postgres]' alembic
      - name: Static checks
        run: |
          ruff check tests/test_mcp_wave1_compatibility.py
          ruff format --check tests/test_mcp_wave1_compatibility.py
          git diff --check
      - name: Real subprocess and TCP protocol regression
        env:
          PYTHONPATH: src:.
        run: >-
          python -m pytest tests/test_mcp_wave1_compatibility.py
          tests/test_mcp_protocol_matrix.py tests/test_mcp_enterprise_trust_domain.py
          tests/test_mcp_http_transport.py -q --no-cov --tb=short
      - name: Source-bound infrastructure assertions only
        env:
          PYTHONPATH: src:.
        run: >-
          python -m pytest tests/test_cloud_staging_static.py
          tests/test_m4_cloud_origin_static.py
          tests/test_terraform_m4_validate.py::test_cloud_terraform_tree_present -q --no-cov

  frameworks:
    name: Genuine frameworks Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install actual framework packages
        run: python -m pip install -r tests/requirements-wave1-frameworks.txt
      - name: Framework static checks
        run: |
          ruff check tests/test_wave1_framework_compatibility.py
          ruff format --check tests/test_wave1_framework_compatibility.py
          git diff --check
      - name: Actual framework objects and negative contract consumers
        env:
          PYTHONPATH: src:sdk/python
        run: >-
          python -m pytest tests/test_wave1_framework_compatibility.py
          tests/test_langchain_middleware.py tests/test_langgraph_gate.py
          tests/test_adk_toolset.py -q -o addopts='' --noconftest

# No production secrets, model-provider calls, cloud credentials or deployments.
# SQLite transport fixtures and controlled framework provider contracts do not
# qualify PostgreSQL durability, core authority, containment or production readiness.
