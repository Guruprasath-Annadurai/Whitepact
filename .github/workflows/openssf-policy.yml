name: OpenSSF Policy Guard

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  policy:
    name: OpenSSF policy checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Reject movable GitHub Action references
        run: python scripts/check_pinned_actions.py

      - name: Enforce source copyright and SPDX headers
        run: python scripts/manage_license_headers.py --check

      - name: Enforce non-SLSA trust controls and public claim boundaries
        run: python scripts/check_trust_regressions.py

      - name: Enforce MCP public capability counts
        run: python scripts/check_mcp_docs.py

      - name: Check public launch-surface local links
        run: python scripts/check_launch_links.py
