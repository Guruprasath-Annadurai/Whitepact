name: OpenSSF Policy Guard

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  pinned-actions:
    name: Immutable GitHub Action pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Reject movable GitHub Action references
        run: python scripts/check_pinned_actions.py
