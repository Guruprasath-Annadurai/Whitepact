name: M13 Recovery Zero Qualification

on:
  pull_request:
    branches:
      - codex/whitepact-m13-absolute-convergence
      - antigravity/whitepact-m13-recovery-zero
  push:
    branches:
      - antigravity/whitepact-m13-recovery-zero
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-zero-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: wp
          POSTGRES_PASSWORD: wp
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U wp" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: src:.
      WHITEPACT_TEST_PG_ADMIN_URL: postgresql://wp:wp@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-m11.txt
          python -m pip install '.[dashboard,postgres,mcp]' alembic ruff==0.17.0
      - name: Hygiene checks
        run: |
          ruff check src/responsibleai/data_governance/ tests/test_m13_recovery_zero_p0_reproducers.py
          python scripts/check_pinned_actions.py
          python scripts/manage_license_headers.py --check
      - name: H4 Adversarial Recovery Suite
        run: |
          python -m pytest tests/test_h4_backup_recovery_adversarial.py -o addopts='' --junitxml=/tmp/h4_adversarial.xml --tb=short -ra
      - name: P0 Recovery Reproducers and Admission Gate Suite
        run: |
          python -m pytest tests/test_m13_recovery_zero_p0_reproducers.py -o addopts='' --junitxml=/tmp/p0_reproducers.xml --tb=short -ra
      - name: Independent Fortress Restore Suite
        run: |
          PYTHONPATH=. python -m pytest scripts/engineering/reproducers/test_m13_fortress_restore_independent.py -o addopts='' --junitxml=/tmp/fortress_independent.xml --tb=short -ra
      - name: Preserve test receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-zero-receipts-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/h4_adversarial.xml
            /tmp/p0_reproducers.xml
            /tmp/fortress_independent.xml
