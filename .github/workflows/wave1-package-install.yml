name: Wave 1 External SDK Package Qualification

on:
  push:
    branches: [codex/whitepact-wave1-sdk-package-qualification, codex/whitepact-enterprise-product-completion]
  pull_request:
    paths:
      - 'tests/test_wave1_package_install.py'
      - 'tests/fixtures/wave1_packages/**'
      - '.github/workflows/wave1-package-install.yml'

permissions:
  contents: read

jobs:
  packages:
    name: External SDK consumers Python ${{ matrix.python }} Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install isolated package validation tooling
        run: |
          python -m pip install -r sdk/python/requirements-test.txt
          docker pull golang@sha256:1cf6c45ba39db9fd6db16922041d074a63c935556a05c5ccb62d181034df7f02
      - name: Package qualification static checks
        run: |
          ruff check tests/test_wave1_package_install.py
          ruff format --check tests/test_wave1_package_install.py
          git diff --check
      - name: Fresh external Python wheel, npm tarball and Go module consumers
        run: >-
          python -m pytest tests/test_wave1_package_install.py
          -q -o addopts='' --noconftest

# Local package creation/installation only; no registry publication or credentials.
# Go uses a local replace in an external consumer; remote module fetching is not claimed.
