# Canonical WhitePact listing metadata, shared across every platform
# submission so text isn't duplicated (and drifted) across nine forms.
# Tool/resource lists are NOT duplicated here -- they're generated live
# from TOOL_DEFS/RESOURCE_DEFS and served at the server-card URL below;
# copy that reference into a submission form, not a stale snapshot.

name: whitepact
display_name: WhitePact
short_description: >-
  Runtime authority and governance for AI agents and autonomous systems over MCP.
description: >-
  WhitePact is an MIT-licensed AI governance platform with a hosted MCP server.
  Intelligence may propose; WhitePact governs high-impact execution through
  policy, approvals, and evidence-oriented controls. Tool and resource counts
  are generated from src/responsibleai/mcp/metadata.py (never hard-coded here).

homepage: https://github.com/Guruprasath-Annadurai/Whitepact
documentation: https://github.com/Guruprasath-Annadurai/Whitepact#readme
repository: https://github.com/Guruprasath-Annadurai/Whitepact

mcp_endpoint:
  streamable_http: https://whitepact-mcp-http.onrender.com/mcp
  legacy_sse: https://whitepact-mcp-http.onrender.com/sse
  server_card: https://whitepact-mcp-http.onrender.com/.well-known/mcp/server-card.json
  health: https://whitepact-mcp-http.onrender.com/health

# Real, currently-reachable (verified 200 live, 2026-08-13) but not on a
# branded domain yet -- swapping to a dedicated domain is a founder
# action noted in FOUNDER_ACTIONS.md, not a content gap.
support: mailto:annaduraiguruprasath7@gmail.com
privacy: https://raw.githubusercontent.com/Guruprasath-Annadurai/Whitepact/main/PRIVACY_POLICY.md
terms: https://raw.githubusercontent.com/Guruprasath-Annadurai/Whitepact/main/TERMS_OF_SERVICE.md

# No dedicated icon file path is asserted here -- reuse whatever asset
# path the OpenAI submission used (see compliance/OPENAI_PLUGIN_SUBMISSION_PREP.md);
# do not redesign the logo for this task, per instructions.
icon: null # TODO_FOUNDER_ACTION_REQUIRED: point at the canonical logo asset path

version: "1.3.0" # align with pyproject.toml / responsibleai.__version__
listing_version: "1.3.0" # MCP Registry listing version (bump with releases)

transport:
  primary: streamable-http
  legacy: sse
  self_hosted: stdio

auth:
  type: apiKey
  scheme: Bearer
  oauth_authorization_server: null # not deployed -- static Bearer keys only

tools:
  count_source: src/responsibleai/mcp/metadata.py
  registered_count: 30
  public_count: 30
  note: regenerate from metadata.py on each release; public_count excludes test.* tools when present
  all_read_only: false
  all_non_destructive: true
