# Canonical WhitePact listing metadata, shared across every platform
# submission so text isn't duplicated (and drifted) across nine forms.
# Tool/resource lists are NOT duplicated here -- they're generated live
# from TOOL_DEFS/RESOURCE_DEFS and served at the server-card URL below;
# copy that reference into a submission form, not a stale snapshot.

name: whitepact
display_name: WhitePact
short_description: >-
  The authority layer for autonomous systems -- trust scoring, guardrails,
  and compliance checks for any LLM agent, over MCP.
description: >-
  WhitePact is an AI governance MCP server: trust scoring, PII/harmful
  content guardrails, hallucination detection, and compliance checks
  (NIST AI RMF, EU AI Act, ISO 42001) for any LLM agent. All 30 tools are
  read-only -- WhitePact evaluates and reports, it does not act on an
  agent's behalf.

homepage: https://github.com/Guruprasath-Annadurai/Whitepact
documentation: https://github.com/Guruprasath-Annadurai/Whitepact#readme
repository: https://github.com/Guruprasath-Annadurai/Whitepact

mcp_endpoint:
  deployment_status: external_gate_unverified
  streamable_http: https://YOUR_WHITEPACT_HOST/mcp
  legacy_sse: https://YOUR_WHITEPACT_HOST/sse
  server_card: https://YOUR_WHITEPACT_HOST/.well-known/mcp/server-card.json
  health: https://YOUR_WHITEPACT_HOST/health

# Candidate deployment target only. The endpoint timed out during the
# 2026-08-27 RC check; do not submit or advertise it as live until the
# deployment evidence in compliance/ENTERPRISE_RC_GATE_REGISTER.md exists.
support: mailto:annaduraiguruprasath7@gmail.com
privacy: https://raw.githubusercontent.com/Guruprasath-Annadurai/Whitepact/main/PRIVACY_POLICY.md
terms: https://raw.githubusercontent.com/Guruprasath-Annadurai/Whitepact/main/TERMS_OF_SERVICE.md

# No dedicated icon file path is asserted here -- reuse whatever asset
# path the OpenAI submission used (see compliance/OPENAI_PLUGIN_SUBMISSION_PREP.md);
# do not redesign the logo for this task, per instructions.
icon: null # TODO_FOUNDER_ACTION_REQUIRED: point at the canonical logo asset path

version: "1.2.2" # published PyPI package version
listing_version: "1.2.3" # MCP Registry listing version
candidate_version: "1.2.4rc1" # source candidate; not published yet

transport:
  primary: streamable-http
  legacy: sse
  self_hosted: stdio

auth:
  type: oauth2_or_apiKey
  scheme: Bearer
  oauth_authorization_server: null # external deployment/IdP gate

tools:
  count: 30
  all_read_only: true
  all_non_destructive: true
